version: '3.8'

networks:
  dspacenet:
    ipam:
      config:
        - subnet: 172.23.0.0/16

services:
  # DSpace backend webapp container
  dspace:
    container_name: dspace
    environment:
      # Configuración básica de DSpace
      dspace__P__dir: /dspace
      dspace__P__name: 'Biblioteca Digital'

      # Base de datos
      db__P__url: 'jdbc:postgresql://dspacedb:5432/dspace'
      db__P__username: '${POSTGRES_USER}'
      db__P__password: '${POSTGRES_PASSWORD}'

      # Solr
      solr__P__server: 'http://dspacesolr:8983/solr'

      # Configuración de red
      proxies__P__trusted__P__ipranges: '172.23.0, 172.27.0'

      # URLs (Docker Desktop en Windows - host.docker.internal es visible
      # desde el navegador y desde los contenedores)
      dspace__P__server__P__url: 'http://host.docker.internal:8090/server'
      dspace__P__ui__P__url: 'http://localhost:4000'

      # Permitir peticiones desde localhost (CORS) y la URL pública de ngrok
      rest__P__cors__P__allowed__origins: 'http://localhost:4000, http://host.docker.internal:4000, http://localhost:8088, http://localhost:3000, https://pouch-earwig-boxy.ngrok-free.dev'

      # Configuración de idioma español
      default__P__locale: 'es'
      webui__P__supported__P__locales: 'es'
      LANG: 'es_ES.UTF-8'
      LANGUAGE: 'es_ES:es'
      LC_ALL: 'es_ES.UTF-8'

      # Logging
      LOGGING_CONFIG: '/dspace/config/log4j2-container.xml'

      # Email desactivado para desarrollo
      mail__P__server__P__disabled: 'true'

      # Memoria Java
      JAVA_OPTS: '-Xmx2048m -Xms1024m -Duser.language=es -Duser.country=ES'

    image: dspace/dspace:dspace-7_x
    depends_on:
      - dspacedb
      - dspacesolr
    networks:
      - dspacenet
    ports:
      - "8090:8080"
      - "8000:8000"
    volumes:
      - dspace_data:/dspace/assetstore
      - dspace_solr_data:/dspace/solr

  # PostgreSQL database container
  dspacedb:
    container_name: dspacedb
    image: dspace/dspace-postgres-pgcrypto:dspace-7_x
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /pgdata
    networks:
      - dspacenet
    ports:
      - "5433:5432"  # NOTA: Idealmente restringir con firewall externo
    volumes:
      - pgdata:/pgdata

  # Solr container
  dspacesolr:
    container_name: dspacesolr
    image: dspace/dspace-solr:dspace-7_x
    networks:
      - dspacenet
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr/data
    # Precrear los núcleos que DSpace requiere (search, statistics, oai,
    # authority) — sin esto el backend truena al arrancar con volumen nuevo
    entrypoint:
      - /bin/bash
      - '-c'
      - |
        init-var-solr
        precreate-core authority /opt/solr/server/solr/configsets/authority
        cp -r /opt/solr/server/solr/configsets/authority/* /var/solr/data/authority
        precreate-core oai /opt/solr/server/solr/configsets/oai
        cp -r /opt/solr/server/solr/configsets/oai/* /var/solr/data/oai
        precreate-core search /opt/solr/server/solr/configsets/search
        cp -r /opt/solr/server/solr/configsets/search/* /var/solr/data/search
        precreate-core statistics /opt/solr/server/solr/configsets/statistics
        cp -r /opt/solr/server/solr/configsets/statistics/* /var/solr/data/statistics
        exec solr -f

  # DSpace Angular UI
  dspace-angular:
    container_name: dspace-angular
    image: dspace/dspace-angular:dspace-7_x
    depends_on:
      - dspace
    environment:
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: '0.0.0.0'
      DSPACE_UI_PORT: '4000'
      DSPACE_UI_NAMESPACE: '/'
      DSPACE_REST_SSL: 'false'
      DSPACE_REST_HOST: 'host.docker.internal'
      DSPACE_REST_PORT: '8090'
      DSPACE_REST_NAMESPACE: '/server'

      # Configuración de idioma español
      LANG: 'es_ES.UTF-8'
      LANGUAGE: 'es_ES:es'
      LC_ALL: 'es_ES.UTF-8'
      TZ: 'America/Argentina/Buenos_Aires'

      # Idioma por defecto para Angular
      DEFAULT_LANGUAGE: 'es'
      LANGUAGES: '[{"code":"es","label":"Español","active":true},{"code":"en","label":"English","active":true}]'
    volumes:
      - ./dspace-angular-config/config.yml:/app/config/config.yml:ro
      - ./dspace-angular-config/config.prod.yml:/app/config/config.prod.yml:ro
    networks:
      - dspacenet
    ports:
      - "4000:4000"
    # El host/puerto se configuran vía variables DSPACE_UI_*; el override de
    # "yarn serve --allowed-hosts" dejó de ser compatible con la imagen actual.

  # === AUTHENTICATION SERVICE ===

  # Servicio de Autenticación Centralizado (SSO)
  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - dspacedb
      - koha-db
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET}
      - DB_HOST=dspacedb
      - DB_PORT=5432
      - DB_NAME=biblioteca_auth
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DSPACE_API_URL=http://dspace:8080/server/api
      - KOHA_API_URL=http://koha:8081/api
      - BASE_URL=http://localhost:8088
    networks:
      - dspacenet
    ports:
      - "3000:3000"
    volumes:
      - ./auth-service:/app
      - /app/node_modules

  # === KOHA SERVICES ===

  # MariaDB database for Koha
  koha-db:
    container_name: koha-mariadb
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - koha_db_data:/var/lib/mysql
      - ./koha/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dspacenet
    ports:
      - "3307:3306"  # NOTA: Idealmente restringir con firewall externo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Memcached for Koha
  koha-memcached:
    container_name: koha-memcached
    image: memcached:alpine
    restart: unless-stopped
    command: memcached -m 128
    networks:
      - dspacenet
    ports:
      - "11212:11211"

  # Koha Web Application (Sistema de gestión bibliotecaria)
  koha-web:
    container_name: koha-web
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - koha-db
    volumes:
      - ./koha/web:/usr/share/nginx/html:ro
      - ./koha/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dspacenet
    ports:
      - "8081:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
      - LANG=es_ES.UTF-8
      - LANGUAGE=es_ES:es
      - LC_ALL=es_ES.UTF-8

  # Koha REAL (paquetes oficiales koha-common, reemplaza al Koha nativo de WSL)
  koha:
    container_name: koha
    build:
      context: .
      dockerfile: Dockerfile.koha-docker
    restart: unless-stopped
    # Apache de Koha usa mpm-itk (cambia de usuario por petición); el perfil
    # seccomp default de Docker le bloquea initgroups/setgroups
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SETUID
      - SETGID
    depends_on:
      - koha-db
      - koha-memcached
    environment:
      DB_HOST: koha-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KOHA_INSTANCE: ${KOHA_INSTANCE}
      MEMCACHED_SERVERS: koha-memcached:11211
      TZ: America/Mexico_City
      LANG: es_ES.UTF-8
    volumes:
      - koha_config:/etc/koha
      - koha_data:/var/lib/koha
      - koha_logs:/var/log/koha
    networks:
      - dspacenet
    ports:
      - "8082:8080"   # OPAC (catálogo público)
      - "8101:8081"   # Staff (administración bibliotecaria)

  # Koha API Proxy (Placeholder para futuras integraciones)
  koha-api:
    container_name: koha-api
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - koha-db
    volumes:
      - ./koha/api:/usr/share/nginx/html:ro
    networks:
      - dspacenet
    ports:
      - "8089:80"
    environment:
      - LANG=es_ES.UTF-8
      - LANGUAGE=es_ES:es
      - LC_ALL=es_ES.UTF-8
    command: >
      sh -c "
        echo 'Koha API Proxy iniciado' &&
        nginx -g 'daemon off;'
      "

  # Panel de Administración
  admin-panel:
    container_name: admin-panel
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./admin-panel:/usr/share/nginx/html:ro
      - ./nginx-admin-panel.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dspacenet
    ports:
      - "8088:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    depends_on:
      - auth-service

  # Proxy Unificado para ngrok (Plan Gratuito)
  # DESACTIVADO temporalmente: dependía de Koha nativo en WSL (/usr/share/koha).
  # Se reactivará al configurar ngrok con el nuevo Koha dockerizado.
  # ngrok-proxy:
  #   container_name: ngrok-proxy
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   volumes:
  #     - ./nginx-proxy-unified.conf:/etc/nginx/nginx.conf:ro
  #     - ./admin-panel:/usr/share/nginx/html:ro
  #   networks:
  #     - dspacenet
  #   ports:
  #     - "9000:80"
  #   depends_on:
  #     - admin-panel
  #     - auth-service

volumes:
  pgdata:
  solr_data:
  dspace_data:
  dspace_solr_data:
  koha_db_data:
  koha_data:
  koha_config:
  koha_logs:
