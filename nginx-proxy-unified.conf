events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Servidor proxy unificado para ngrok (plan gratuito)
    server {
        listen 80;
        server_name _;

        # Headers para compatibilidad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # DSpace Angular (Frontend)
        location /dspace/ {
            proxy_pass http://dspace-angular:4000/dspace/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Prefix /dspace;

            # Timeouts aumentados para DSpace Angular (puede tardar en compilar)
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Reescribir cookies para sub-path
            proxy_cookie_path / /dspace/;
        }

        # DSpace API (Backend REST)
        location /server/ {
            proxy_pass http://dspace:8080/server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Headers CORS para API
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # Recursos estáticos de Koha Staff/OPAC - Proxy directo a Apache (puertos REALES de la config)
        # Staff (Intranet) = Puerto 80, OPAC = Puerto 8080
        location /intranet-tmpl/ {
            proxy_pass http://172.17.0.1:80/intranet-tmpl/;
            proxy_set_header Host $host;
        }

        location /opac-tmpl/ {
            proxy_pass http://172.17.0.1:8080/opac-tmpl/;
            proxy_set_header Host $host;
        }

        # CGI scripts de Koha sin prefijo - proxy a Apache Staff (puerto 80)
        location /cgi-bin/koha/ {
            proxy_pass http://172.17.0.1:80/cgi-bin/koha/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / /;
        }

        # Koha OPAC (Catálogo Público) - Puerto 8080
        location /koha/ {
            proxy_pass http://172.17.0.1:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /koha;

            # Reescribir cookies para sub-path
            proxy_cookie_path / /koha/;

            # Reescribir enlaces en el HTML
            proxy_redirect / /koha/;

            # Reescribir URLs en el contenido HTML/JS/CSS
            sub_filter_types text/html text/css text/javascript application/javascript;
            sub_filter_once off;
            sub_filter '"/opac-tmpl/' '"/koha/opac-tmpl/';
            sub_filter "'/opac-tmpl/" "'/koha/opac-tmpl/";
            sub_filter '"/cgi-bin/koha/' '"/koha/cgi-bin/koha/';
            sub_filter "'/cgi-bin/koha/" "'/koha/cgi-bin/koha/";

            # Buffer para procesar respuestas
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Koha Staff Interface (Administración) - Puerto 80
        location /koha-staff/ {
            proxy_pass http://172.17.0.1:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /koha-staff;

            # Reescribir cookies para sub-path
            proxy_cookie_path / /koha-staff/;

            # Reescribir enlaces en el HTML
            proxy_redirect / /koha-staff/;

            # Reescribir URLs en el contenido HTML/JS/CSS
            sub_filter_types text/html text/css text/javascript application/javascript;
            sub_filter_once off;
            sub_filter '"/intranet-tmpl/' '"/koha-staff/intranet-tmpl/';
            sub_filter "'/intranet-tmpl/" "'/koha-staff/intranet-tmpl/";
            sub_filter '"/cgi-bin/koha/' '"/koha-staff/cgi-bin/koha/';
            sub_filter "'/cgi-bin/koha/" "'/koha-staff/cgi-bin/koha/";

            # Buffer para procesar respuestas
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # API del auth-service
        location /api/ {
            proxy_pass http://auth-service:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # No CORS headers needed - mismo origen
        }

        # Admin panel (páginas HTML) - DEBE IR AL FINAL
        location / {
            proxy_pass http://admin-panel:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
