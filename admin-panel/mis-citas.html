<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas - Orientación Educativa HENM</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #9D2449;
            --secondary-color: #2E7D32;
            --accent-gold: #D4AF37;
            --accent-red: #CE1126;
            --text-dark: #333333;
            --white: #FFFFFF;
            --bg-light: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F1F1;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(to right,
                var(--secondary-color) 0%, var(--secondary-color) 33.33%,
                var(--white) 33.33%, var(--white) 66.66%,
                var(--accent-red) 66.66%, var(--accent-red) 100%);
            position: fixed;
            top: 0;
            z-index: 9999;
        }

        .super-header {
            width: 100%;
            background-color: #691C32;
            margin-top: 8px;
            padding: 0;
        }

        .super-header img {
            height: 60px;
            width: auto;
        }

        .sub-header {
            width: 100%;
            background-color: #E8DCC8;
            display: flex;
            justify-content: center;
        }

        .main-container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        .header-card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            border-top: 4px solid var(--accent-gold);
        }

        .page-title {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.8rem;
            margin: 0;
        }

        .page-title i {
            color: var(--accent-gold);
        }

        .btn-nueva-cita {
            padding: 12px 30px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, #1B5E20 100%);
            color: white;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-nueva-cita:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
            color: white;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-tab {
            padding: 10px 20px;
            border-radius: 20px;
            background: white;
            border: 2px solid #E0E0E0;
            color: var(--text-dark);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-tab:hover {
            border-color: var(--accent-gold);
        }

        .filter-tab.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7A1D3A 100%);
            border-color: var(--primary-color);
            color: white;
        }

        .cita-card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 5px solid #E0E0E0;
            transition: all 0.3s ease;
        }

        .cita-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .cita-card.pendiente {
            border-left-color: #FFA726;
        }

        .cita-card.aceptada {
            border-left-color: var(--secondary-color);
        }

        .cita-card.completada {
            border-left-color: #2196F3;
        }

        .cita-card.rechazada,
        .cita-card.cancelada_estudiante,
        .cita-card.cancelada_orientador {
            border-left-color: #EF5350;
            opacity: 0.7;
        }

        .cita-card.propuesta_alternativa {
            border-left-color: #9C27B0;
        }

        .cita-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .cita-fecha {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .cita-estado {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .estado-pendiente {
            background: #FFF3E0;
            color: #E65100;
        }

        .estado-aceptada {
            background: #E8F5E9;
            color: #1B5E20;
        }

        .estado-completada {
            background: #E3F2FD;
            color: #0D47A1;
        }

        .estado-rechazada,
        .estado-cancelada {
            background: #FFEBEE;
            color: #B71C1C;
        }

        .estado-propuesta {
            background: #F3E5F5;
            color: #4A148C;
        }

        .cita-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-item i {
            color: var(--accent-gold);
            font-size: 1.2rem;
        }

        .cita-motivo {
            background: #F5F5F5;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .cita-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 8px 20px;
            border-radius: 4px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .btn-cancelar {
            background: #EF5350;
            color: white;
        }

        .btn-cancelar:hover {
            background: #C62828;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #DDD;
        }

        .footer {
            width: 100%;
            background-color: #691C32;
            margin-top: auto;
        }

        .footer img {
            width: 100%;
            height: auto;
        }

        @media (max-width: 768px) {
            .cita-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>

    <div class="super-header">
        <img src="SuperHeader.png" alt="Gobierno de México">
    </div>

    <div class="sub-header">
        <img src="HeaderColegioNaval.png" alt="Universidad Naval - HENM">
    </div>

    <div class="main-container">
        <div class="header-card">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <h1 class="page-title">
                    <i class="fas fa-calendar-check"></i> Mis Citas de Orientación
                </h1>
                <div>
                    <a href="solicitar-cita.html" class="btn-nueva-cita">
                        <i class="fas fa-plus"></i> Nueva Cita
                    </a>
                    <a href="dashboard.html" class="btn btn-secondary ms-2">
                        <i class="fas fa-arrow-left"></i> Dashboard
                    </a>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filtrarCitas('todas')">
                <i class="fas fa-list"></i> Todas
            </button>
            <button class="filter-tab" onclick="filtrarCitas('pendiente')">
                <i class="fas fa-clock"></i> Pendientes
            </button>
            <button class="filter-tab" onclick="filtrarCitas('aceptada')">
                <i class="fas fa-check"></i> Aceptadas
            </button>
            <button class="filter-tab" onclick="filtrarCitas('completada')">
                <i class="fas fa-check-double"></i> Completadas
            </button>
        </div>

        <div id="citasContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando citas...</span>
                </div>
                <p class="mt-3">Cargando tus citas...</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <img src="Footer.png" alt="Footer Institucional">
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const AUTH_API = '/api';
        let todasLasCitas = [];
        let filtroActual = 'todas';

        const estadosMap = {
            'pendiente': { texto: 'Pendiente', clase: 'estado-pendiente' },
            'aceptada': { texto: 'Aceptada', clase: 'estado-aceptada' },
            'completada': { texto: 'Completada', clase: 'estado-completada' },
            'rechazada': { texto: 'Rechazada', clase: 'estado-rechazada' },
            'propuesta_alternativa': { texto: 'Propuesta Alternativa', clase: 'estado-propuesta' },
            'cancelada_estudiante': { texto: 'Cancelada', clase: 'estado-cancelada' },
            'cancelada_orientador': { texto: 'Cancelada por Orientador', clase: 'estado-cancelada' }
        };

        window.addEventListener('DOMContentLoaded', function() {
            const usuario = sessionStorage.getItem('usuario');
            if (!usuario) {
                window.location.href = 'index.html';
                return;
            }

            cargarMisCitas();
        });

        async function cargarMisCitas() {
            try {
                const response = await fetch(`${AUTH_API}/citas/mis-citas`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error al cargar citas');
                }

                todasLasCitas = data.citas;
                mostrarCitas();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('citasContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i>
                        Error al cargar citas: ${error.message}
                    </div>
                `;
            }
        }

        function filtrarCitas(filtro) {
            filtroActual = filtro;

            // Actualizar tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.filter-tab').classList.add('active');

            mostrarCitas();
        }

        function mostrarCitas() {
            const container = document.getElementById('citasContainer');

            let citasFiltradas = todasLasCitas;
            if (filtroActual !== 'todas') {
                citasFiltradas = todasLasCitas.filter(c => c.estado === filtroActual);
            }

            if (citasFiltradas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h3>No hay citas ${filtroActual !== 'todas' ? filtroActual + 's' : ''}</h3>
                        <p>Puedes solicitar una nueva cita con un orientador</p>
                        <a href="solicitar-cita.html" class="btn-nueva-cita mt-3">
                            <i class="fas fa-plus"></i> Solicitar Cita
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = citasFiltradas.map(cita => {
                const fecha = new Date(cita.fecha_hora);
                const estadoInfo = estadosMap[cita.estado] || { texto: cita.estado, clase: '' };

                return `
                    <div class="cita-card ${cita.estado}">
                        <div class="cita-header">
                            <div class="cita-fecha">
                                <i class="fas fa-calendar"></i>
                                ${fecha.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                                <br>
                                <small style="font-size: 1rem; color: #666;">
                                    <i class="fas fa-clock"></i>
                                    ${fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}
                                    (${cita.duracion_minutos} min)
                                </small>
                            </div>
                            <span class="cita-estado ${estadoInfo.clase}">${estadoInfo.texto}</span>
                        </div>

                        <div class="cita-info">
                            <div class="info-item">
                                <i class="fas fa-user-md"></i>
                                <div>
                                    <strong>${cita.orientador_nombre} ${cita.orientador_apellido}</strong>
                                    <br>
                                    <small class="text-muted">${cita.orientador_especialidad || 'Orientador'}</small>
                                </div>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-video"></i>
                                <div>
                                    <strong>Modalidad</strong>
                                    <br>
                                    <small>${cita.modalidad}</small>
                                </div>
                            </div>
                            ${cita.ubicacion ? `
                                <div class="info-item">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <div>
                                        <strong>Ubicación</strong>
                                        <br>
                                        <small>${cita.ubicacion}</small>
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="cita-motivo">
                            <strong><i class="fas fa-comment-alt"></i> Motivo:</strong> ${cita.motivo}
                            ${cita.descripcion_estudiante ? `<br><small class="text-muted">${cita.descripcion_estudiante}</small>` : ''}
                        </div>

                        ${cita.notas_orientador ? `
                            <div class="alert alert-info mb-3">
                                <strong><i class="fas fa-sticky-note"></i> Notas del Orientador:</strong><br>
                                ${cita.notas_orientador}
                            </div>
                        ` : ''}

                        ${cita.motivo_rechazo ? `
                            <div class="alert alert-danger mb-3">
                                <strong><i class="fas fa-times-circle"></i> Motivo de Rechazo:</strong><br>
                                ${cita.motivo_rechazo}
                            </div>
                        ` : ''}

                        <div class="cita-actions">
                            ${cita.estado === 'pendiente' || cita.estado === 'aceptada' ? `
                                <button class="btn-action btn-cancelar" onclick="cancelarCita(${cita.id})">
                                    <i class="fas fa-times"></i> Cancelar
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function cancelarCita(id) {
            if (!confirm('¿Estás seguro que deseas cancelar esta cita?')) {
                return;
            }

            const motivo = prompt('Por favor indica el motivo de la cancelación:');
            if (!motivo) {
                return;
            }

            try {
                const response = await fetch(`${AUTH_API}/citas/${id}`, {
                    method: 'DELETE',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ motivo_cancelacion: motivo })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error al cancelar cita');
                }

                alert('Cita cancelada correctamente');
                cargarMisCitas();
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cancelar cita: ' + error.message);
            }
        }
    </script>
</body>
</html>
