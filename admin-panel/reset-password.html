<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Biblioteca Digital HENM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #9D2449 0%, #7A1D3A 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #9D2449;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .user-info {
            background: #f8f9fa;
            border-left: 4px solid #9D2449;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .user-info strong {
            color: #9D2449;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #9D2449;
            box-shadow: 0 0 0 3px rgba(157, 36, 73, 0.1);
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-weak { background: #dc3545; width: 33%; }
        .strength-medium { background: #ffc107; width: 66%; }
        .strength-strong { background: #28a745; width: 100%; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9D2449 0%, #7A1D3A 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 36, 73, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-screen {
            text-align: center;
            padding: 40px 0;
        }

        .loading-screen .spinner {
            width: 40px;
            height: 40px;
            border-color: rgba(157, 36, 73, 0.3);
            border-top-color: #9D2449;
        }

        .loading-screen p {
            margin-top: 20px;
            color: #666;
        }

        #resetForm {
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #9D2449;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Restablecer Contraseña</h1>
            <p>Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.</p>
        </div>

        <div id="messageBox" class="message"></div>

        <div id="loadingScreen" class="loading-screen">
            <div class="spinner"></div>
            <p>Validando enlace de recuperación...</p>
        </div>

        <form id="resetForm">
            <div id="userInfo" class="user-info" style="display: none;">
                Restableciendo contraseña para: <strong id="userName"></strong>
            </div>

            <div class="form-group">
                <label for="password">Nueva Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                <div class="password-requirements">
                    Mínimo 6 caracteres
                </div>
                <div class="password-strength">
                    <div id="strengthBar" class="password-strength-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                Restablecer Contraseña
            </button>
        </form>

        <div class="back-link">
            <a href="index.html">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let currentToken = null;

        // Extraer token de URL
        function getTokenFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }

        // Validar token al cargar la página
        async function validateToken() {
            const token = getTokenFromURL();

            if (!token) {
                showMessage('No se proporcionó un token de recuperación válido.', 'error');
                document.getElementById('loadingScreen').style.display = 'none';
                return;
            }

            currentToken = token;

            try {
                const response = await fetch(`${API_BASE}/password-reset/validate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (data.valid) {
                    // Token válido, mostrar formulario
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('resetForm').style.display = 'block';
                    document.getElementById('userInfo').style.display = 'block';
                    document.getElementById('userName').textContent = `${data.nombre} ${data.apellido} (${data.email})`;
                } else {
                    // Token inválido o expirado
                    showMessage(data.message || 'El enlace de recuperación es inválido o ha expirado.', 'error');
                    document.getElementById('loadingScreen').innerHTML = `
                        <div class="icon">❌</div>
                        <p style="color: #721c24; font-weight: 500;">Enlace inválido o expirado</p>
                        <p style="margin-top: 10px; font-size: 13px;">El enlace de recuperación solo es válido por 1 hora.</p>
                    `;
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('Error de conexión. Verifica que el servicio de autenticación esté activo.', 'error');
                document.getElementById('loadingScreen').style.display = 'none';
            }
        }

        // Verificar fortaleza de contraseña
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('strengthBar');

            if (password.length < 6) {
                strengthBar.className = 'password-strength-bar';
            } else if (password.length < 10) {
                strengthBar.className = 'password-strength-bar strength-weak';
            } else if (password.length < 14) {
                strengthBar.className = 'password-strength-bar strength-medium';
            } else {
                strengthBar.className = 'password-strength-bar strength-strong';
            }
        }

        // Evento de cambio en campo de contraseña
        document.getElementById('password').addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
        });

        // Manejar envío del formulario
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageBox = document.getElementById('messageBox');

            // Validar que las contraseñas coincidan
            if (password !== confirmPassword) {
                showMessage('Las contraseñas no coinciden', 'error');
                return;
            }

            // Validar longitud mínima
            if (password.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            // Deshabilitar botón y mostrar spinner
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Restableciendo...';
            messageBox.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/password-reset/reset`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: currentToken,
                        nueva_password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Contraseña actualizada exitosamente
                    showMessage('¡Contraseña actualizada exitosamente!', 'success');

                    // Limpiar formulario
                    document.getElementById('resetForm').reset();

                    // Redirigir al login después de 2 segundos
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);

                } else {
                    showMessage(data.message || 'Error al restablecer la contraseña', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Restablecer Contraseña';
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('Error de conexión. Verifica que el servicio de autenticación esté activo.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Restablecer Contraseña';
            }
        });

        function showMessage(text, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
            messageBox.style.display = 'block';
        }

        // Validar token al cargar la página
        window.addEventListener('DOMContentLoaded', validateToken);
    </script>
</body>
</html>
