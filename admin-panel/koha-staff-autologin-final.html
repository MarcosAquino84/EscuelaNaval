<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koha Staff - Auto Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #9D2449;
            --secondary-color: #2E7D32;
            --accent-gold: #D4AF37;
            --accent-red: #CE1126;
            --text-dark: #333333;
            --white: #FFFFFF;
            --bg-light: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F1F1;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(to right,
                var(--secondary-color) 0%,
                var(--secondary-color) 33.33%,
                var(--white) 33.33%,
                var(--white) 66.66%,
                var(--accent-red) 66.66%,
                var(--accent-red) 100%);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .super-header {
            width: 100%;
            background-color: #691C32;
            margin-top: 8px;
            padding: 0;
            overflow: hidden;
        }

        .super-header img {
            height: 60px;
            width: auto;
            display: block;
        }

        .sub-header {
            width: 100%;
            background-color: #E8DCC8;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .sub-header img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .loading-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .loading-card {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            border-top: 4px solid var(--accent-gold);
            text-align: center;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #7A1D3A 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }

        .logo-box i {
            font-size: 40px;
            color: var(--accent-gold);
        }

        .spinner {
            border: 5px solid rgba(157, 36, 73, 0.2);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .status {
            padding: 15px 20px;
            background: linear-gradient(135deg, #F5F5F5 0%, #E8E8E8 100%);
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .status i {
            margin-right: 8px;
            color: var(--primary-color);
        }

        .alert {
            border-radius: 4px;
            padding: 12px 15px;
            margin-top: 20px;
            border-left: 4px solid;
            font-size: 0.9rem;
        }

        .alert-info {
            background-color: #E3F2FD;
            border-left-color: #2196F3;
            color: #1565C0;
        }

        .btn-manual {
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn-manual:hover {
            background: #7A1D3A;
            color: white;
        }

        .footer {
            width: 100%;
            background-color: #691C32;
            padding: 0;
            margin-top: auto;
        }

        .footer img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>

    <div class="super-header">
        <img src="SuperHeader.png" alt="Gobierno de México">
    </div>

    <div class="sub-header">
        <img src="HeaderColegioNaval.png" alt="Universidad Naval - HENM">
    </div>

    <div class="loading-container">
        <div class="loading-card">
            <div class="logo-box">
                <i class="fas fa-user-cog"></i>
            </div>
            <div class="spinner" id="spinner"></div>
            <h2>Accediendo a Koha Staff</h2>
            <p>Interfaz de Administración</p>
            <div class="status" id="statusMessage">
                <i class="fas fa-circle-notch fa-spin"></i>
                Iniciando sesión automáticamente...
            </div>
            <div id="infoContainer" class="alert alert-info d-none">
                <p><strong>⚠️ Auto-login no disponible</strong></p>
                <p>Serás redirigido a Koha Staff. Por favor, usa estas credenciales:</p>
                <p><strong>Usuario:</strong> admin<br><strong>Password:</strong> admin123</p>
                <a href="http://localhost:8080/cgi-bin/koha/mainpage.pl" class="btn-manual">Continuar a Koha Staff</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <img src="Footer.png" alt="Footer Institucional">
    </footer>

    <script>
        // Mapeo de usuarios
        const kohaUserMap = {
            'admin@biblioteca.local': 'admin',
            'marcos@biblioteca.local': 'mbiblioteca',
            'alumno@biblioteca.local': 'abiblioteca',
            'maria.garcia@estudiante.local': 'mgarcia',
            'psic.martinez@henm.edu.mx': 'pmartinez',
            'psic.lopez@henm.edu.mx': 'plopez'
        };

        const statusMessage = document.getElementById('statusMessage');
        const infoContainer = document.getElementById('infoContainer');
        const spinner = document.getElementById('spinner');

        function getKohaBaseUrl() {
            // SIEMPRE usar la URL directa de Koha en localhost
            // Esto asegura que las cookies se establezcan en el dominio correcto
            return 'http://localhost:8080';
        }

        async function performLogin() {
            try {
                // Obtener credenciales
                const usuario = JSON.parse(sessionStorage.getItem('usuario'));

                if (!usuario || !usuario.email || !usuario.password) {
                    console.log('No hay credenciales, redirigiendo...');
                    showManualOption();
                    return;
                }

                const kohaUserid = kohaUserMap[usuario.email] || usuario.email;
                const kohaBaseUrl = getKohaBaseUrl();
                const loginUrl = kohaBaseUrl + '/cgi-bin/koha/mainpage.pl';

                console.log('Usando URL:', loginUrl);
                console.log('Usuario:', kohaUserid);

                statusMessage.innerHTML = '<i class="fas fa-key"></i> Preparando credenciales...';

                // Crear FormData para el login
                const formData = new URLSearchParams();
                formData.append('op', 'cud-login');
                formData.append('koha_login_context', 'intranet');
                formData.append('login_userid', kohaUserid);
                formData.append('login_password', usuario.password);

                statusMessage.innerHTML = '<i class="fas fa-paper-plane"></i> Enviando credenciales...';

                // Hacer el login usando fetch con credentials: 'include' para manejar cookies
                const response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString(),
                    credentials: 'include', // CRUCIAL: incluir cookies
                    redirect: 'manual' // No seguir redirects automáticamente
                });

                console.log('Response status:', response.status);
                console.log('Response type:', response.type);

                statusMessage.innerHTML = '<i class="fas fa-check-circle"></i> Sesión establecida...';

                // Pequeño delay para asegurar que la cookie se establezca
                await new Promise(resolve => setTimeout(resolve, 1000));

                statusMessage.innerHTML = '<i class="fas fa-sync fa-spin"></i> Redirigiendo a Koha Staff...';

                // Redirigir a Koha Staff en la misma ventana
                // Esto asegura que las cookies se mantengan
                window.location.href = kohaBaseUrl + '/cgi-bin/koha/mainpage.pl';

            } catch (error) {
                console.error('Error en auto-login:', error);
                showManualOption();
            }
        }

        function showManualOption() {
            spinner.style.display = 'none';
            statusMessage.classList.add('d-none');
            infoContainer.classList.remove('d-none');
        }

        // Ejecutar al cargar
        window.addEventListener('DOMContentLoaded', performLogin);
    </script>
</body>
</html>
