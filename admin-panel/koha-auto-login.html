<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accediendo a Koha Staff</title>

    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            /* Paleta institucional mexicana */
            --primary-color: #9D2449;      /* Guinda institucional */
            --secondary-color: #2E7D32;    /* Verde institucional */
            --accent-gold: #D4AF37;        /* Dorado emblemas */
            --accent-red: #CE1126;         /* Rojo bandera */
            --text-dark: #333333;          /* Gris oscuro texto */
            --white: #FFFFFF;              /* Blanco */
            --bg-light: #F5F5F5;           /* Fondo claro */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F1F1;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Barra tricolor superior */
        .top-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(to right,
                var(--secondary-color) 0%,
                var(--secondary-color) 33.33%,
                var(--white) 33.33%,
                var(--white) 66.66%,
                var(--accent-red) 66.66%,
                var(--accent-red) 100%);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        /* Super Header - Gobierno de México */
        .super-header {
            width: 100%;
            background-color: #691C32;
            margin-top: 8px;
            padding: 0;
            overflow: hidden;
        }

        .super-header img {
            height: 60px;
            width: auto;
            display: block;
        }

        /* Sub Header - Colegio Naval */
        .sub-header {
            width: 100%;
            background-color: #E8DCC8;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .sub-header img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Container de loading */
        .loading-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .loading-card {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            border-top: 4px solid var(--accent-gold);
            text-align: center;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #7A1D3A 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }

        .logo-box i {
            font-size: 40px;
            color: var(--accent-gold);
        }

        .spinner {
            border: 5px solid rgba(157, 36, 73, 0.2);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .status {
            padding: 15px 20px;
            background: linear-gradient(135deg, #F5F5F5 0%, #E8E8E8 100%);
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .status i {
            margin-right: 8px;
            color: var(--primary-color);
        }

        .alert {
            border-radius: 4px;
            padding: 12px 15px;
            margin-top: 20px;
            border-left: 4px solid;
            font-size: 0.9rem;
        }

        .alert-danger {
            background-color: #FDECEA;
            border-left-color: var(--accent-red);
            color: #7A1D1D;
        }

        /* Footer institucional */
        .footer {
            width: 100%;
            background-color: #691C32;
            padding: 0;
            margin-top: auto;
        }

        .footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .super-header img {
                height: 45px;
            }

            .loading-card {
                padding: 30px 25px;
            }

            h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Barra tricolor superior -->
    <div class="top-bar"></div>

    <!-- Super Header - Gobierno de México -->
    <div class="super-header">
        <img src="SuperHeader.png" alt="Gobierno de México">
    </div>

    <!-- Sub Header - Colegio Naval -->
    <div class="sub-header">
        <img src="HeaderColegioNaval.png" alt="Universidad Naval - HENM">
    </div>

    <!-- Container de loading -->
    <div class="loading-container">
        <div class="loading-card">
            <div class="logo-box">
                <i class="fas fa-user-cog"></i>
            </div>
            <div class="spinner"></div>
            <h2>Accediendo a Koha Staff</h2>
            <p>Interfaz de Administración</p>
            <div class="status" id="statusMessage">
                <i class="fas fa-circle-notch fa-spin"></i>
                Iniciando sesión automáticamente...
            </div>
            <div id="errorContainer" class="alert alert-danger d-none"></div>
        </div>
    </div>

    <!-- Footer institucional -->
    <footer class="footer">
        <img src="Footer.png" alt="Footer Institucional">
    </footer>

    <!-- Formulario oculto que se auto-enviará -->
    <form id="kohaLoginForm" action="" method="POST" style="display:none;">
        <input type="hidden" name="op" value="cud-login">
        <input type="hidden" name="koha_login_context" value="intranet">
        <input type="text" name="login_userid" id="login_userid">
        <input type="password" name="login_password" id="login_password">
    </form>

    <script>
        // Detectar entorno y configurar URLs
        const isNgrok = window.location.hostname.includes('ngrok');
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        let staffBaseUrl;
        let loginUrl;

        if (isNgrok) {
            // Desde ngrok, usar path /koha-staff
            staffBaseUrl = window.location.origin + '/koha-staff';
            loginUrl = staffBaseUrl + '/cgi-bin/koha/mainpage.pl';
        } else if (isLocalhost && window.location.port === '9000') {
            // Desde proxy unificado local (puerto 9000)
            staffBaseUrl = window.location.origin + '/koha-staff';
            loginUrl = staffBaseUrl + '/cgi-bin/koha/mainpage.pl';
        } else {
            // Acceso directo a Koha (puerto 80)
            staffBaseUrl = 'http://172.27.72.64';
            loginUrl = staffBaseUrl + '/cgi-bin/koha/mainpage.pl';
        }

        // Configurar action del formulario dinámicamente
        document.getElementById('kohaLoginForm').action = loginUrl;

        const statusMessage = document.getElementById('statusMessage');
        const errorContainer = document.getElementById('errorContainer');

        // Mapeo de emails a userids de Koha (ACTUALIZADOS CON USUARIOS REALES)
        const kohaUserMap = {
            'admin@biblioteca.local': 'admin',
            'marcos@biblioteca.local': 'mbiblioteca',
            'alumno@biblioteca.local': 'abiblioteca',
            'maria.garcia@estudiante.local': 'mgarcia',
            'psic.martinez@henm.edu.mx': 'pmartinez',
            'psic.lopez@henm.edu.mx': 'plopez'
        };

        async function autoLoginKoha() {
            try {
                // Obtener credenciales del localStorage
                const usuario = JSON.parse(localStorage.getItem('usuario'));

                if (!usuario || !usuario.email || !usuario.password) {
                    throw new Error('No se encontraron credenciales válidas');
                }

                statusMessage.innerHTML = '<i class="fas fa-key"></i> Preparando credenciales...';

                // Mapear email a userid de Koha
                const kohaUserid = kohaUserMap[usuario.email] || usuario.email;

                // Llenar el formulario oculto
                document.getElementById('login_userid').value = kohaUserid;
                document.getElementById('login_password').value = usuario.password;

                statusMessage.innerHTML = '<i class="fas fa-paper-plane"></i> Enviando credenciales a Koha...';

                // Esperar un momento y enviar el formulario
                setTimeout(() => {
                    document.getElementById('kohaLoginForm').submit();
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                errorContainer.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i>${error.message}. Redirigiendo a Koha...`;
                errorContainer.classList.remove('d-none');

                // Redirigir a Koha después de 2 segundos
                setTimeout(() => {
                    window.location.href = staffBaseUrl + '/cgi-bin/koha/mainpage.pl';
                }, 2000);
            }
        }

        // Ejecutar al cargar la página
        window.addEventListener('DOMContentLoaded', autoLoginKoha);
    </script>
</body>
</html>
