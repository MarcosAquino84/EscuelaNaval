<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accediendo a Koha...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        .spinner-border {
            width: 4rem;
            height: 4rem;
        }
        .logo {
            font-size: 80px;
            color: #9C27B0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">
            <i class="fas fa-books"></i>
        </div>
        <div class="spinner-border text-primary mb-4" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <h3>Accediendo a Koha</h3>
        <p class="text-muted" id="statusMessage">Iniciando sesión automáticamente...</p>
        <div id="errorContainer" class="alert alert-danger mt-4 d-none"></div>
    </div>

    <!-- Formulario oculto que se auto-enviará -->
    <form id="kohaLoginForm" action="http://172.27.72.64/cgi-bin/koha/mainpage.pl" method="POST" style="display:none;">
        <input type="hidden" name="op" value="cud-login">
        <input type="hidden" name="koha_login_context" value="intranet">
        <input type="text" name="login_userid" id="login_userid">
        <input type="password" name="login_password" id="login_password">
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script>
        const statusMessage = document.getElementById('statusMessage');
        const errorContainer = document.getElementById('errorContainer');

        // Mapeo de emails a userids de Koha
        const kohaUserMap = {
            'admin@biblioteca.local': 'admin',
            'alumno@biblioteca.local': 'alumno',
            'marcos@biblioteca.local': 'Marcos',
            'maria.garcia@estudiante.local': 'maria.garcia'
        };

        async function autoLoginKoha() {
            try {
                // Obtener credenciales del sessionStorage
                const usuario = JSON.parse(sessionStorage.getItem('usuario'));

                if (!usuario || !usuario.email || !usuario.password) {
                    throw new Error('No se encontraron credenciales válidas');
                }

                statusMessage.textContent = 'Preparando credenciales...';

                // Mapear email a userid de Koha
                const kohaUserid = kohaUserMap[usuario.email] || usuario.email;

                // Llenar el formulario oculto
                document.getElementById('login_userid').value = kohaUserid;
                document.getElementById('login_password').value = usuario.password;

                statusMessage.textContent = 'Enviando credenciales a Koha...';

                // Esperar un momento y enviar el formulario
                setTimeout(() => {
                    document.getElementById('kohaLoginForm').submit();
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                errorContainer.textContent = `Error: ${error.message}. Redirigiendo a Koha...`;
                errorContainer.classList.remove('d-none');

                // Redirigir a Koha después de 2 segundos
                setTimeout(() => {
                    window.location.href = 'http://172.27.72.64/cgi-bin/koha/mainpage.pl';
                }, 2000);
            }
        }

        // Ejecutar al cargar la página
        window.addEventListener('DOMContentLoaded', autoLoginKoha);
    </script>
</body>
</html>
