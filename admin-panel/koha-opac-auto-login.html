<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accediendo al OPAC - Koha</title>

    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            /* Paleta institucional mexicana */
            --primary-color: #9D2449;      /* Guinda institucional */
            --secondary-color: #2E7D32;    /* Verde institucional */
            --accent-gold: #D4AF37;        /* Dorado emblemas */
            --accent-red: #CE1126;         /* Rojo bandera */
            --text-dark: #333333;          /* Gris oscuro texto */
            --white: #FFFFFF;              /* Blanco */
            --bg-light: #F5F5F5;           /* Fondo claro */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F1F1;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Barra tricolor superior */
        .top-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(to right,
                var(--secondary-color) 0%,
                var(--secondary-color) 33.33%,
                var(--white) 33.33%,
                var(--white) 66.66%,
                var(--accent-red) 66.66%,
                var(--accent-red) 100%);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        /* Super Header - Gobierno de México */
        .super-header {
            width: 100%;
            background-color: #691C32;
            margin-top: 8px;
            padding: 0;
            overflow: hidden;
        }

        .super-header img {
            height: 60px;
            width: auto;
            display: block;
        }

        /* Sub Header - Colegio Naval */
        .sub-header {
            width: 100%;
            background-color: #E8DCC8;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .sub-header img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Container de loading */
        .loading-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .loading-card {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            border-top: 4px solid var(--accent-gold);
            text-align: center;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #7A1D3A 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }

        .logo-box i {
            font-size: 40px;
            color: var(--accent-gold);
        }

        .spinner {
            border: 5px solid rgba(157, 36, 73, 0.2);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .status {
            padding: 15px 20px;
            background: linear-gradient(135deg, #F5F5F5 0%, #E8E8E8 100%);
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .status i {
            margin-right: 8px;
            color: var(--primary-color);
        }

        /* Footer institucional */
        .footer {
            width: 100%;
            background-color: #691C32;
            padding: 0;
            margin-top: auto;
        }

        .footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .super-header img {
                height: 45px;
            }

            .loading-card {
                padding: 30px 25px;
            }

            h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Barra tricolor superior -->
    <div class="top-bar"></div>

    <!-- Super Header - Gobierno de México -->
    <div class="super-header">
        <img src="SuperHeader.png" alt="Gobierno de México">
    </div>

    <!-- Sub Header - Colegio Naval -->
    <div class="sub-header">
        <img src="HeaderColegioNaval.png" alt="Universidad Naval - HENM">
    </div>

    <!-- Container de loading -->
    <div class="loading-container">
        <div class="loading-card">
            <div class="logo-box">
                <i class="fas fa-book-open"></i>
            </div>
            <div class="spinner"></div>
            <h2>Accediendo al OPAC</h2>
            <p>Catálogo Público - Koha</p>
            <div class="status" id="status">
                <i class="fas fa-circle-notch fa-spin"></i>
                Preparando acceso...
            </div>
        </div>
    </div>

    <!-- Footer institucional -->
    <footer class="footer">
        <img src="Footer.png" alt="Footer Institucional">
    </footer>

    <script>
        // Obtener datos del usuario desde localStorage
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        const status = document.getElementById('status');

        if (!usuario) {
            status.innerHTML = '<i class="fas fa-exclamation-circle"></i> No hay sesión activa. Redirigiendo al login...';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        } else {
            // Mapeo de emails a userids de Koha (ACTUALIZADOS)
            const kohaUserMap = {
                'admin@biblioteca.local': 'admin',
                'marcos@biblioteca.local': 'mbiblioteca',
                'alumno@biblioteca.local': 'abiblioteca',
                'maria.garcia@estudiante.local': 'mgarcia',
                'psic.martinez@henm.edu.mx': 'pmartinez',
                'psic.lopez@henm.edu.mx': 'plopez'
            };

            const kohaUserid = kohaUserMap[usuario.email] || usuario.email.split('@')[0];

            // Koha 24.05+ exige token CSRF en el login: se obtiene vía el
            // proxy del panel (/koha/, mismo origen). Pero NAVEGAR Koha por el
            // proxy rompe rutas y sesión (Koha usa rutas absolutas), así que
            // en acceso local el formulario se envía al puerto directo del
            // OPAC: la cookie de sesión se comparte entre puertos del host.
            const opacBaseUrl = window.location.origin + '/koha';
            const isLocal = /^\d+\.\d+\.\d+\.\d+$/.test(window.location.hostname) || window.location.hostname === 'localhost';
            const opacDestino = isLocal ? 'http://' + window.location.hostname + ':8082' : opacBaseUrl;

            status.innerHTML = `<i class="fas fa-user"></i> Usuario: ${kohaUserid}`;

            async function autoLogin() {
                status.innerHTML = '<i class="fas fa-key"></i> Obteniendo token de sesión...';

                // 1. Cargar la portada del OPAC para obtener csrf_token + cookie de sesión
                let csrfToken = '';
                try {
                    const resp = await fetch(opacBaseUrl + '/cgi-bin/koha/opac-main.pl', { credentials: 'include' });
                    const html = await resp.text();
                    const match = html.match(/name="csrf_token"\s+value="([^"]+)"/);
                    if (match) csrfToken = match[1];
                } catch (e) {
                    console.error('No se pudo obtener csrf_token:', e);
                }

                status.innerHTML = '<i class="fas fa-key"></i> Enviando credenciales...';

                // 2. Enviar el formulario de login con el token
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = opacDestino + '/cgi-bin/koha/opac-user.pl';
                form.id = 'autoLoginForm';

                const campos = {
                    koha_login_context: 'opac',
                    login_op: 'cud-login',
                    csrf_token: csrfToken,
                    login_userid: kohaUserid,
                    login_password: usuario.password
                };
                for (const [name, value] of Object.entries(campos)) {
                    const field = document.createElement('input');
                    field.type = 'hidden';
                    field.name = name;
                    field.value = value;
                    form.appendChild(field);
                }

                document.body.appendChild(form);
                status.innerHTML = `<i class="fas fa-check-circle"></i> Ingresando al OPAC... (Usuario: ${kohaUserid})`;
                setTimeout(() => form.submit(), 500);
            }

            setTimeout(autoLogin, 1000);
        }
    </script>
</body>
</html>
