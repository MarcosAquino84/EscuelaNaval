<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accediendo a Koha Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #9D2449;
            --secondary-color: #2E7D32;
            --accent-gold: #D4AF37;
            --accent-red: #CE1126;
            --text-dark: #333333;
            --white: #FFFFFF;
            --bg-light: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F1F1;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(to right,
                var(--secondary-color) 0%,
                var(--secondary-color) 33.33%,
                var(--white) 33.33%,
                var(--white) 66.66%,
                var(--accent-red) 66.66%,
                var(--accent-red) 100%);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .super-header {
            width: 100%;
            background-color: #691C32;
            margin-top: 8px;
            padding: 0;
            overflow: hidden;
        }

        .super-header img {
            height: 60px;
            width: auto;
            display: block;
        }

        .sub-header {
            width: 100%;
            background-color: #E8DCC8;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .sub-header img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        #kohaFrame {
            flex: 1;
            width: 100%;
            border: none;
            min-height: calc(100vh - 200px);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .loading-card {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
            border-top: 4px solid var(--accent-gold);
            text-align: center;
        }

        .spinner {
            border: 5px solid rgba(157, 36, 73, 0.2);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 15px;
        }

        .footer {
            width: 100%;
            background-color: #691C32;
            padding: 0;
            margin-top: auto;
        }

        .footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>

    <div class="super-header">
        <img src="SuperHeader.png" alt="Gobierno de México">
    </div>

    <div class="sub-header">
        <img src="HeaderColegioNaval.png" alt="Universidad Naval - HENM">
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h2>Accediendo a Koha Staff</h2>
            <p id="statusMessage">Iniciando sesión automáticamente...</p>
        </div>
    </div>

    <!-- Iframe que contendrá Koha -->
    <iframe id="kohaFrame" class="hidden"></iframe>

    <footer class="footer">
        <img src="Footer.png" alt="Footer Institucional">
    </footer>

    <!-- Formulario oculto para login -->
    <form id="loginForm" method="POST" target="kohaFrame" style="display:none;">
        <input type="hidden" name="op" value="cud-login">
        <input type="hidden" name="koha_login_context" value="intranet">
        <input type="text" name="login_userid" id="userid">
        <input type="password" name="login_password" id="password">
    </form>

    <script>
        // Mapeo de usuarios
        const kohaUserMap = {
            'admin@biblioteca.local': 'admin',
            'marcos@biblioteca.local': 'mbiblioteca',
            'alumno@biblioteca.local': 'abiblioteca',
            'maria.garcia@estudiante.local': 'mgarcia',
            'psic.martinez@henm.edu.mx': 'pmartinez',
            'psic.lopez@henm.edu.mx': 'plopez'
        };

        const statusMessage = document.getElementById('statusMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const kohaFrame = document.getElementById('kohaFrame');
        const loginForm = document.getElementById('loginForm');

        async function performAutoLogin() {
            try {
                // Obtener credenciales
                const usuario = JSON.parse(sessionStorage.getItem('usuario'));

                if (!usuario || !usuario.email || !usuario.password) {
                    throw new Error('No se encontraron credenciales válidas');
                }

                // Detectar entorno
                const isNgrok = window.location.hostname.includes('ngrok');
                const isProxy = window.location.port === '9000';

                let kohaBaseUrl;
                if (isNgrok) {
                    kohaBaseUrl = window.location.origin + '/koha-staff';
                } else if (isProxy) {
                    kohaBaseUrl = window.location.origin + '/koha-staff';
                } else {
                    kohaBaseUrl = 'http://172.27.72.64';
                }

                const loginUrl = kohaBaseUrl + '/cgi-bin/koha/mainpage.pl';

                // Mapear usuario
                const kohaUserid = kohaUserMap[usuario.email] || usuario.email;

                statusMessage.textContent = 'Preparando credenciales...';

                // Configurar formulario
                loginForm.action = loginUrl;
                document.getElementById('userid').value = kohaUserid;
                document.getElementById('password').value = usuario.password;

                statusMessage.textContent = 'Iniciando sesión en Koha...';

                // Enviar formulario en el iframe
                loginForm.submit();

                // Esperar a que el iframe cargue
                kohaFrame.onload = function() {
                    setTimeout(() => {
                        // Ocultar loading y mostrar iframe
                        loadingOverlay.classList.add('hidden');
                        kohaFrame.classList.remove('hidden');

                        // Intentar navegar a la página principal dentro del iframe
                        try {
                            kohaFrame.contentWindow.location.href = kohaBaseUrl + '/cgi-bin/koha/mainpage.pl';
                        } catch (e) {
                            console.log('Iframe cargado, sesión establecida');
                        }
                    }, 2000);
                };

            } catch (error) {
                console.error('Error:', error);
                statusMessage.innerHTML = `<span class="text-danger">Error: ${error.message}</span>`;

                // Redirigir después de 2 segundos
                setTimeout(() => {
                    const kohaUrl = 'http://172.27.72.64/cgi-bin/koha/mainpage.pl';
                    window.location.href = kohaUrl;
                }, 2000);
            }
        }

        // Ejecutar al cargar
        window.addEventListener('DOMContentLoaded', performAutoLogin);
    </script>
</body>
</html>
