<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios - Biblioteca Digital HENM</title>

    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            /* Paleta institucional mexicana */
            --primary-color: #9D2449;      /* Guinda institucional */
            --secondary-color: #2E7D32;    /* Verde institucional */
            --accent-gold: #D4AF37;        /* Dorado emblemas */
            --accent-red: #CE1126;         /* Rojo bandera */
            --text-dark: #333333;          /* Gris oscuro texto */
            --white: #FFFFFF;              /* Blanco */
            --bg-light: #F5F5F5;           /* Fondo claro */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F1F1;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Barra tricolor superior */
        .top-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(to right,
                var(--secondary-color) 0%,
                var(--secondary-color) 33.33%,
                var(--white) 33.33%,
                var(--white) 66.66%,
                var(--accent-red) 66.66%,
                var(--accent-red) 100%);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        /* Super Header - Gobierno de México */
        .super-header {
            width: 100%;
            background-color: #691C32;
            margin-top: 8px;
            padding: 0;
            overflow: hidden;
        }

        .super-header img {
            height: 60px;
            width: auto;
            display: block;
        }

        /* Sub Header - Colegio Naval */
        .sub-header {
            width: 100%;
            background-color: #E8DCC8;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .sub-header img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Container */
        .main-container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        .header-card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            border-top: 4px solid var(--accent-gold);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.8rem;
            margin: 0;
        }

        .page-title i {
            color: var(--accent-gold);
            margin-right: 10px;
        }

        .btn-back {
            padding: 10px 25px;
            border-radius: 4px;
            background: #E0E0E0;
            color: var(--text-dark);
            border: 2px solid #D0D0D0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(157, 36, 73, 0.3);
        }

        .btn-new-user {
            padding: 12px 30px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, #1B5E20 100%);
            color: white;
            border: 2px solid var(--secondary-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-new-user:hover {
            background: linear-gradient(135deg, #1B5E20 0%, var(--secondary-color) 100%);
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        }

        .users-card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .users-table {
            width: 100%;
            margin-top: 20px;
        }

        .users-table thead {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7A1D3A 100%);
            color: white;
        }

        .users-table th {
            padding: 15px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .users-table td {
            padding: 15px;
            vertical-align: middle;
        }

        .users-table tbody tr {
            border-bottom: 1px solid #E0E0E0;
            transition: background 0.2s ease;
        }

        .users-table tbody tr:hover {
            background: #F5F5F5;
        }

        .badge-admin {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7A1D3A 100%);
            color: white;
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-estudiante {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #1B5E20 100%);
            color: white;
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-profesor {
            background: linear-gradient(135deg, #1976D2 0%, #0D47A1 100%);
            color: white;
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-psicologo {
            background: linear-gradient(135deg, #7B1FA2 0%, #4A148C 100%);
            color: white;
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-orientador {
            background: linear-gradient(135deg, #7B1FA2 0%, #4A148C 100%);
            color: white;
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .btn-action {
            padding: 8px 15px;
            border-radius: 4px;
            border: none;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 3px;
        }

        .btn-edit {
            background: #FFA726;
            color: white;
        }

        .btn-edit:hover {
            background: #FB8C00;
            transform: scale(1.05);
        }

        .btn-delete {
            background: #EF5350;
            color: white;
        }

        .btn-delete:hover {
            background: #E53935;
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 0;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7A1D3A 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-weight: 700;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .modal-close:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E0E0;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-item label {
            font-weight: 500;
            cursor: pointer;
            margin: 0;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #E0E0E0;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-submit {
            padding: 12px 30px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, #1B5E20 100%);
            color: white;
            border: 2px solid var(--secondary-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1B5E20 0%, var(--secondary-color) 100%);
            border-color: var(--accent-gold);
            transform: scale(1.05);
        }

        .btn-cancel {
            padding: 12px 30px;
            border-radius: 4px;
            background: #E0E0E0;
            color: var(--text-dark);
            border: 2px solid #D0D0D0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #D0D0D0;
            transform: scale(1.05);
        }

        .alert {
            padding: 15px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #E8F5E9;
            color: #2E7D32;
            border-left: 4px solid var(--secondary-color);
        }

        .alert-error {
            background: #FFEBEE;
            color: #C62828;
            border-left: 4px solid #EF5350;
        }

        /* Footer institucional */
        .footer {
            width: 100%;
            background-color: #691C32;
            padding: 0;
            margin-top: auto;
        }

        .footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .super-header img {
                height: 45px;
            }

            .main-container {
                padding: 20px 15px;
            }

            .users-table {
                font-size: 0.85rem;
            }

            .users-table th,
            .users-table td {
                padding: 10px 8px;
            }

            .btn-action {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Barra tricolor superior -->
    <div class="top-bar"></div>

    <!-- Super Header - Gobierno de México -->
    <div class="super-header">
        <img src="SuperHeader.png" alt="Gobierno de México">
    </div>

    <!-- Sub Header - Colegio Naval -->
    <div class="sub-header">
        <img src="HeaderColegioNaval.png" alt="Universidad Naval - HENM">
    </div>

    <div class="main-container">
        <!-- Header -->
        <div class="header-card">
            <div class="header-actions">
                <h1 class="page-title">
                    <i class="fas fa-users-cog"></i> Administración de Usuarios
                </h1>
                <div>
                    <button class="btn-new-user" onclick="abrirModalNuevoUsuario()">
                        <i class="fas fa-user-plus"></i> Nuevo Usuario
                    </button>
                    <a href="dashboard.html" class="btn-back">
                        <i class="fas fa-arrow-left"></i> Volver al Dashboard
                    </a>
                </div>
            </div>
        </div>

        <!-- Alertas -->
        <div id="alertContainer"></div>

        <!-- Tabla de usuarios -->
        <div class="users-card">
            <h3 style="color: var(--primary-color); font-weight: 700; margin-bottom: 20px;">
                <i class="fas fa-list"></i> Usuarios Registrados
            </h3>
            <div class="table-responsive">
                <table class="users-table table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Tipo</th>
                            <th>Privilegios</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer institucional -->
    <footer class="footer">
        <img src="Footer.png" alt="Footer Institucional">
    </footer>

    <!-- Modal para crear/editar usuario -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Usuario</h3>
                <button class="modal-close" onclick="cerrarModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="userForm" onsubmit="guardarUsuario(event)">
                <div class="modal-body">
                    <input type="hidden" id="userId" name="id">

                    <div class="form-group">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="apellido">Apellido</label>
                        <input type="text" class="form-control" id="apellido" name="apellido" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password">
                        <small class="text-muted" id="passwordHelp">Dejar en blanco para mantener la contraseña actual</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="tipo">Tipo de Usuario</label>
                        <select class="form-select" id="tipo" name="tipo" required onchange="cambiarTipoUsuario()">
                            <option value="">Seleccionar tipo...</option>
                            <option value="administrador">Administrador</option>
                            <option value="estudiante">Estudiante</option>
                            <option value="profesor">Profesor</option>
                            <option value="psicologo">Psicólogo/Orientador</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Privilegios de Acceso</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="priv_dspace" name="privilegios.dspace">
                                <label for="priv_dspace">DSpace</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="priv_koha_opac" name="privilegios.koha_opac">
                                <label for="priv_koha_opac">Koha OPAC</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="priv_koha_staff" name="privilegios.koha_staff">
                                <label for="priv_koha_staff">Koha Staff</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="priv_admin" name="privilegios.admin">
                                <label for="priv_admin">Panel Admin</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save"></i> Guardar Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const AUTH_API = '/api';
        let editandoUsuario = false;

        // Verificar que el usuario sea administrador
        window.addEventListener('DOMContentLoaded', function() {
            const usuario = sessionStorage.getItem('usuario');

            if (!usuario) {
                window.location.href = 'index.html';
                return;
            }

            const usuarioData = JSON.parse(usuario);
            if (!usuarioData.privilegios || !usuarioData.privilegios.admin) {
                mostrarAlerta('No tiene permisos para acceder a esta página', 'error');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
                return;
            }

            cargarUsuarios();
        });

        // Cargar lista de usuarios
        async function cargarUsuarios() {
            try {
                const response = await fetch(`${AUTH_API}/usuarios`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error al cargar usuarios');
                }

                mostrarUsuarios(data.usuarios);
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al cargar usuarios: ' + error.message, 'error');
                document.getElementById('usersTableBody').innerHTML =
                    '<tr><td colspan="6" class="text-center">Error al cargar usuarios</td></tr>';
            }
        }

        // Mostrar usuarios en la tabla
        function mostrarUsuarios(usuarios) {
            const tbody = document.getElementById('usersTableBody');

            if (!usuarios || usuarios.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">No hay usuarios registrados</td></tr>';
                return;
            }

            tbody.innerHTML = usuarios.map(usuario => `
                <tr>
                    <td><strong>${usuario.id}</strong></td>
                    <td>${usuario.nombre} ${usuario.apellido}</td>
                    <td>${usuario.email}</td>
                    <td>
                        <span class="badge-${usuario.tipo}">${usuario.tipo}</span>
                    </td>
                    <td>
                        ${usuario.privilegios.dspace ? '<i class="fas fa-check text-success" title="DSpace"></i>' : '<i class="fas fa-times text-danger"></i>'} DSpace
                        <br>
                        ${usuario.privilegios.koha_opac ? '<i class="fas fa-check text-success" title="Koha OPAC"></i>' : '<i class="fas fa-times text-danger"></i>'} Koha OPAC
                        <br>
                        ${usuario.privilegios.koha_staff ? '<i class="fas fa-check text-success" title="Koha Staff"></i>' : '<i class="fas fa-times text-danger"></i>'} Koha Staff
                        <br>
                        ${usuario.privilegios.admin ? '<i class="fas fa-check text-success" title="Admin"></i>' : '<i class="fas fa-times text-danger"></i>'} Admin
                    </td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editarUsuario(${usuario.id})">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                        <button class="btn-action btn-delete" onclick="eliminarUsuario(${usuario.id}, '${usuario.email}')">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Abrir modal para nuevo usuario
        function abrirModalNuevoUsuario() {
            editandoUsuario = false;
            document.getElementById('modalTitle').textContent = 'Nuevo Usuario';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('passwordHelp').style.display = 'none';
            document.getElementById('password').required = true;
            document.getElementById('userModal').classList.add('show');
        }

        // Editar usuario
        async function editarUsuario(id) {
            try {
                const response = await fetch(`${AUTH_API}/usuarios/${id}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error al cargar usuario');
                }

                editandoUsuario = true;
                const usuario = data.usuario;

                document.getElementById('modalTitle').textContent = 'Editar Usuario';
                document.getElementById('userId').value = usuario.id;
                document.getElementById('nombre').value = usuario.nombre;
                document.getElementById('apellido').value = usuario.apellido;
                document.getElementById('email').value = usuario.email;
                document.getElementById('password').value = '';
                document.getElementById('tipo').value = usuario.tipo;

                document.getElementById('priv_dspace').checked = usuario.privilegios.dspace || false;
                document.getElementById('priv_koha_opac').checked = usuario.privilegios.koha_opac || false;
                document.getElementById('priv_koha_staff').checked = usuario.privilegios.koha_staff || false;
                document.getElementById('priv_admin').checked = usuario.privilegios.admin || false;

                document.getElementById('passwordHelp').style.display = 'block';
                document.getElementById('password').required = false;
                document.getElementById('userModal').classList.add('show');

            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al cargar usuario: ' + error.message, 'error');
            }
        }

        // Guardar usuario (crear o actualizar)
        async function guardarUsuario(event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const userId = document.getElementById('userId').value;

            const userData = {
                nombre: formData.get('nombre'),
                apellido: formData.get('apellido'),
                email: formData.get('email'),
                tipo: formData.get('tipo'),
                privilegios: {
                    dspace: document.getElementById('priv_dspace').checked,
                    koha_opac: document.getElementById('priv_koha_opac').checked,
                    koha_staff: document.getElementById('priv_koha_staff').checked,
                    admin: document.getElementById('priv_admin').checked
                }
            };

            const password = formData.get('password');
            if (password) {
                userData.password = password;
            }

            try {
                let response;
                if (editandoUsuario && userId) {
                    // Actualizar usuario existente
                    response = await fetch(`${AUTH_API}/usuarios/${userId}`, {
                        method: 'PUT',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });
                } else {
                    // Crear nuevo usuario
                    if (!password) {
                        mostrarAlerta('La contraseña es requerida para nuevos usuarios', 'error');
                        return;
                    }
                    response = await fetch(`${AUTH_API}/usuarios`, {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error al guardar usuario');
                }

                mostrarAlerta(data.message || 'Usuario guardado exitosamente', 'success');
                cerrarModal();
                cargarUsuarios();

            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al guardar usuario: ' + error.message, 'error');
            }
        }

        // Eliminar usuario
        async function eliminarUsuario(id, email) {
            if (!confirm(`¿Está seguro que desea eliminar al usuario ${email}?`)) {
                return;
            }

            try {
                const response = await fetch(`${AUTH_API}/usuarios/${id}`, {
                    method: 'DELETE',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error al eliminar usuario');
                }

                mostrarAlerta(data.message || 'Usuario eliminado exitosamente', 'success');
                cargarUsuarios();

            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al eliminar usuario: ' + error.message, 'error');
            }
        }

        // Cambiar privilegios según tipo de usuario
        function cambiarTipoUsuario() {
            const tipo = document.getElementById('tipo').value;

            if (tipo === 'administrador') {
                // Administrador: Acceso completo a todo
                document.getElementById('priv_dspace').checked = true;
                document.getElementById('priv_koha_opac').checked = true;
                document.getElementById('priv_koha_staff').checked = true;
                document.getElementById('priv_admin').checked = true;
            } else if (tipo === 'estudiante') {
                // Estudiante: Solo consulta de recursos
                document.getElementById('priv_dspace').checked = true;
                document.getElementById('priv_koha_opac').checked = true;
                document.getElementById('priv_koha_staff').checked = false;
                document.getElementById('priv_admin').checked = false;
            } else if (tipo === 'profesor') {
                // Profesor: Acceso a recursos y gestión bibliotecaria
                document.getElementById('priv_dspace').checked = true;
                document.getElementById('priv_koha_opac').checked = true;
                document.getElementById('priv_koha_staff').checked = true;
                document.getElementById('priv_admin').checked = false;
            } else if (tipo === 'psicologo') {
                // Psicólogo/Orientador: Acceso a recursos y sistema de citas
                document.getElementById('priv_dspace').checked = true;
                document.getElementById('priv_koha_opac').checked = true;
                document.getElementById('priv_koha_staff').checked = false;
                document.getElementById('priv_admin').checked = false;
            }
        }

        // Cerrar modal
        function cerrarModal() {
            document.getElementById('userModal').classList.remove('show');
            document.getElementById('userForm').reset();
        }

        // Mostrar alerta
        function mostrarAlerta(mensaje, tipo) {
            const container = document.getElementById('alertContainer');
            const alertClass = tipo === 'success' ? 'alert-success' : 'alert-error';
            const icon = tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

            const alert = document.createElement('div');
            alert.className = `alert ${alertClass}`;
            alert.innerHTML = `
                <i class="fas ${icon}"></i> ${mensaje}
            `;

            container.innerHTML = '';
            container.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('userModal');
            if (event.target === modal) {
                cerrarModal();
            }
        }
    </script>
</body>
</html>
