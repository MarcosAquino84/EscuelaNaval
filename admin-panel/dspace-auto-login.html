<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accediendo a DSpace...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        .spinner-border {
            width: 4rem;
            height: 4rem;
        }
        .logo {
            font-size: 80px;
            color: #2196F3;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">
            <i class="fas fa-archive"></i>
        </div>
        <div class="spinner-border text-primary mb-4" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <h3>Accediendo a DSpace</h3>
        <p class="text-muted" id="statusMessage">Iniciando sesión automáticamente...</p>
        <div id="errorContainer" class="alert alert-danger mt-4 d-none"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script>
        const DSPACE_URL = 'http://172.27.72.64:4000';
        const DSPACE_LOGIN_URL = 'http://172.27.72.64:4000/login';

        async function prepareAutoFill() {
            const statusMessage = document.getElementById('statusMessage');
            const errorContainer = document.getElementById('errorContainer');

            try {
                statusMessage.textContent = 'Verificando sesión...';

                // Obtener credenciales del sessionStorage
                const usuario = JSON.parse(sessionStorage.getItem('usuario'));

                if (!usuario || !usuario.email || !usuario.password) {
                    throw new Error('No se encontraron credenciales válidas. Por favor, inicia sesión primero.');
                }

                statusMessage.textContent = 'Preparando auto-completado de credenciales...';

                // Crear objeto de auto-fill con timestamp de expiración (5 minutos)
                const autoFillData = {
                    email: usuario.email,
                    password: usuario.password,
                    timestamp: Date.now(),
                    expiresIn: 5 * 60 * 1000, // 5 minutos en milisegundos
                    sistema: 'dspace'
                };

                // Guardar en localStorage para que DSpace lo lea
                localStorage.setItem('biblioteca_autofill', JSON.stringify(autoFillData));

                statusMessage.textContent = 'Auto-completado configurado ✓';

                // Esperar un momento para que el usuario vea el mensaje
                await new Promise(resolve => setTimeout(resolve, 800));

                statusMessage.textContent = 'Redirigiendo a DSpace...';

                // Redirigir a la página de login de DSpace
                setTimeout(() => {
                    window.location.href = DSPACE_LOGIN_URL;
                }, 1000);

            } catch (error) {
                console.error('Error en auto-fill:', error);
                errorContainer.textContent = `Error: ${error.message}`;
                errorContainer.classList.remove('d-none');

                // Dar opción de continuar manualmente
                setTimeout(() => {
                    if (confirm('¿Deseas continuar a DSpace de todas formas?')) {
                        window.location.href = DSPACE_URL;
                    } else {
                        window.close();
                    }
                }, 2000);
            }
        }

        // Ejecutar al cargar la página
        window.addEventListener('DOMContentLoaded', prepareAutoFill);
    </script>
</body>
</html>
