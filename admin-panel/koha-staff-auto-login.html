<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accediendo a Koha Staff...</title>

    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #9D2449;
            --secondary-color: #2E7D32;
            --accent-gold: #D4AF37;
            --accent-red: #CE1126;
            --text-dark: #333333;
            --white: #FFFFFF;
            --bg-light: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F1F1;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(to right,
                var(--secondary-color) 0%,
                var(--secondary-color) 33.33%,
                var(--white) 33.33%,
                var(--white) 66.66%,
                var(--accent-red) 66.66%,
                var(--accent-red) 100%);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .super-header {
            width: 100%;
            background-color: #691C32;
            margin-top: 8px;
            padding: 0;
            overflow: hidden;
        }

        .super-header img {
            height: 60px;
            width: auto;
            display: block;
        }

        .sub-header {
            width: 100%;
            background-color: #E8DCC8;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .sub-header img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .loading-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .loading-card {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            border-top: 4px solid var(--accent-gold);
            text-align: center;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #7A1D3A 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }

        .logo-box i {
            font-size: 40px;
            color: var(--accent-gold);
        }

        .spinner {
            border: 5px solid rgba(157, 36, 73, 0.2);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .status {
            padding: 15px 20px;
            background: linear-gradient(135deg, #F5F5F5 0%, #E8E8E8 100%);
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .status i {
            margin-right: 8px;
            color: var(--primary-color);
        }

        .footer {
            width: 100%;
            background-color: #691C32;
            padding: 0;
            margin-top: auto;
        }

        .footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .super-header img {
                height: 45px;
            }
            .loading-card {
                padding: 30px 25px;
            }
            h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Barra tricolor superior -->
    <div class="top-bar"></div>

    <!-- Super Header - Gobierno de México -->
    <div class="super-header">
        <img src="SuperHeader.png" alt="Gobierno de México">
    </div>

    <!-- Sub Header - Colegio Naval -->
    <div class="sub-header">
        <img src="HeaderColegioNaval.png" alt="Universidad Naval - HENM">
    </div>

    <!-- Container de loading -->
    <div class="loading-container">
        <div class="loading-card">
            <div class="logo-box">
                <i class="fas fa-user-cog"></i>
            </div>
            <div class="spinner"></div>
            <h2>Accediendo a Koha Staff</h2>
            <p>Interfaz de Administración</p>
            <div class="status" id="status">
                <i class="fas fa-circle-notch fa-spin"></i>
                Preparando acceso...
            </div>
        </div>
    </div>

    <!-- Footer institucional -->
    <footer class="footer">
        <img src="Footer.png" alt="Footer Institucional">
    </footer>

    <script>
        // Obtener datos del usuario desde sessionStorage
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        const status = document.getElementById('status');

        if (!usuario) {
            status.innerHTML = '<i class="fas fa-exclamation-circle"></i> No hay sesión activa. Redirigiendo al login...';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        } else {
            // Mapeo de emails a userids de Koha
            const kohaUserMap = {
                'admin@biblioteca.local': 'admin',
                'marcos@biblioteca.local': 'mbiblioteca',
                'alumno@biblioteca.local': 'abiblioteca',
                'maria.garcia@estudiante.local': 'mgarcia',
                'psic.martinez@henm.edu.mx': 'pmartinez',
                'psic.lopez@henm.edu.mx': 'plopez'
            };

            const kohaUserid = kohaUserMap[usuario.email] || usuario.email.split('@')[0];

            // Detectar entorno y configurar URLs
            // Usar window.location.origin para obtener el dominio actual (funciona con ngrok)
            const staffBaseUrl = window.location.origin + '/koha-staff';

            status.innerHTML = `<i class="fas fa-user"></i> Usuario: ${kohaUserid}`;

            // Crear formulario para enviar al Staff Interface
            setTimeout(() => {
                status.innerHTML = '<i class="fas fa-key"></i> Enviando credenciales...';

                const form = document.createElement('form');
                form.method = 'POST';
                form.action = staffBaseUrl + '/cgi-bin/koha/mainpage.pl';
                form.id = 'autoLoginForm';

                // Campo de contexto Koha (REQUERIDO para Staff)
                const contextField = document.createElement('input');
                contextField.type = 'hidden';
                contextField.name = 'koha_login_context';
                contextField.value = 'intranet';
                form.appendChild(contextField);

                // Campo de operación (REQUERIDO)
                const opField = document.createElement('input');
                opField.type = 'hidden';
                opField.name = 'op';
                opField.value = 'cud-login';
                form.appendChild(opField);

                // Campo de usuario
                const useridField = document.createElement('input');
                useridField.type = 'hidden';
                useridField.name = 'login_userid';
                useridField.value = kohaUserid;
                form.appendChild(useridField);

                // Campo de contraseña
                const passwordField = document.createElement('input');
                passwordField.type = 'hidden';
                passwordField.name = 'login_password';
                passwordField.value = usuario.password;
                form.appendChild(passwordField);

                // Agregar formulario al body y enviarlo
                document.body.appendChild(form);

                status.innerHTML = `<i class="fas fa-check-circle"></i> Redirigiendo a Koha Staff... (Usuario: ${kohaUserid})`;

                setTimeout(() => {
                    form.submit();
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
