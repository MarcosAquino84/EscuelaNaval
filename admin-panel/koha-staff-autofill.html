<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo a Koha Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9D2449;
            --secondary-color: #2E7D32;
            --accent-gold: #D4AF37;
            --accent-red: #CE1126;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F1F1;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
            border-top: 4px solid var(--accent-gold);
        }

        .spinner {
            border: 5px solid rgba(157, 36, 73, 0.2);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        .credentials {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .credentials strong {
            color: var(--primary-color);
        }

        .code {
            background: #e9ecef;
            padding: 3px 8px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Redirigiendo a Koha Staff</h2>
        <p id="message">Preparando acceso...</p>

        <div class="credentials">
            <p><strong>📋 Credenciales:</strong></p>
            <p>
                <strong>Usuario:</strong> <span class="code">admin</span><br>
                <strong>Password:</strong> <span class="code">admin123</span>
            </p>
            <p style="font-size: 0.85em; color: #666; margin-top: 10px;">
                ℹ️ Las credenciales se autocompletarán automáticamente
            </p>
        </div>
    </div>

    <script>
        const message = document.getElementById('message');

        // Guardar credenciales para auto-fill
        sessionStorage.setItem('koha_autofill', JSON.stringify({
            userid: 'admin',
            password: 'admin123',
            timestamp: Date.now()
        }));

        message.textContent = 'Redirigiendo en 2 segundos...';

        // Redirigir después de 2 segundos
        setTimeout(() => {
            window.location.href = 'http://localhost:8080/cgi-bin/koha/mainpage.pl';
        }, 2000);
    </script>
</body>
</html>
