<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Citas | HENM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-guinda: #9D2449;
            --color-guinda-oscuro: #7a1c38;
            --color-verde: #2E7D32;
            --color-verde-oscuro: #1b5e20;
            --color-dorado: #D4AF37;
            --color-azul: #1976D2;
            --color-gris: #757575;
            --color-gris-claro: #f5f5f5;
        }

        * {
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--color-guinda) 0%, var(--color-verde) 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header-section h1 {
            color: var(--color-guinda);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header-section .subtitle {
            color: var(--color-gris);
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-card.total .icon { color: var(--color-azul); }
        .stat-card.pendientes .icon { color: #FF9800; }
        .stat-card.aceptadas .icon { color: var(--color-verde); }
        .stat-card.completadas .icon { color: #9C27B0; }
        .stat-card.orientadores .icon { color: var(--color-guinda); }
        .stat-card.estudiantes .icon { color: var(--color-dorado); }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-guinda);
            line-height: 1;
        }

        .stat-card .label {
            color: var(--color-gris);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .filters-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .filters-section h5 {
            color: var(--color-guinda);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: var(--color-guinda);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control, .form-select {
            border: 2px solid var(--color-gris-claro);
            border-radius: 8px;
            padding: 10px 15px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--color-guinda);
            box-shadow: 0 0 0 0.2rem rgba(157, 36, 73, 0.25);
        }

        .btn-filtrar {
            background-color: var(--color-guinda);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-filtrar:hover {
            background-color: var(--color-guinda-oscuro);
        }

        .btn-limpiar {
            background-color: var(--color-gris);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-limpiar:hover {
            background-color: #616161;
        }

        .table-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        .table-section h5 {
            color: var(--color-guinda);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background: linear-gradient(135deg, var(--color-guinda), var(--color-verde));
            color: white;
        }

        .table thead th {
            border: none;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .table tbody tr {
            transition: background-color 0.2s ease;
        }

        .table tbody tr:hover {
            background-color: var(--color-gris-claro);
        }

        .table tbody td {
            padding: 15px;
            vertical-align: middle;
        }

        .badge-estado {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-pendiente {
            background-color: #FFF3E0;
            color: #E65100;
        }

        .badge-aceptada {
            background-color: #E8F5E9;
            color: #1B5E20;
        }

        .badge-completada {
            background-color: #E3F2FD;
            color: #0D47A1;
        }

        .badge-rechazada {
            background-color: #FFEBEE;
            color: #B71C1C;
        }

        .badge-propuesta {
            background-color: #F3E5F5;
            color: #4A148C;
        }

        .badge-cancelada {
            background-color: #ECEFF1;
            color: #455A64;
        }

        .btn-accion-tabla {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 2px;
        }

        .btn-ver {
            background-color: var(--color-azul);
            color: white;
        }

        .btn-ver:hover {
            background-color: #1565C0;
        }

        .btn-eliminar {
            background-color: #D32F2F;
            color: white;
        }

        .btn-eliminar:hover {
            background-color: #B71C1C;
        }

        .btn-volver {
            background-color: var(--color-guinda);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-volver:hover {
            background-color: var(--color-guinda-oscuro);
            color: white;
            transform: translateX(-5px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-gris);
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h4 {
            color: var(--color-gris);
            margin-bottom: 10px;
        }

        /* Modal Styles */
        .modal-content {
            border-radius: 15px;
            border: none;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--color-guinda), var(--color-verde));
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 20px 30px;
        }

        .modal-header h5 {
            font-weight: 700;
        }

        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }

        .modal-body {
            padding: 30px;
        }

        .detalle-grupo {
            margin-bottom: 20px;
        }

        .detalle-grupo h6 {
            color: var(--color-guinda);
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--color-gris-claro);
        }

        .detalle-item {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid var(--color-gris-claro);
        }

        .detalle-item:last-child {
            border-bottom: none;
        }

        .detalle-item .label {
            font-weight: 600;
            color: var(--color-gris);
            width: 150px;
            flex-shrink: 0;
        }

        .detalle-item .value {
            color: #333;
            flex-grow: 1;
        }

        .pagination {
            margin-top: 20px;
            justify-content: center;
        }

        .pagination .page-link {
            color: var(--color-guinda);
            border: 1px solid var(--color-gris-claro);
        }

        .pagination .page-item.active .page-link {
            background-color: var(--color-guinda);
            border-color: var(--color-guinda);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-row {
                grid-template-columns: 1fr;
            }

            .table-section {
                padding: 15px;
            }

            .table {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Botón Volver -->
        <a href="dashboard.html" class="btn-volver">
            <i class="fas fa-arrow-left"></i>
            Volver al Panel
        </a>

        <!-- Header -->
        <div class="header-section">
            <h1><i class="fas fa-shield-alt"></i> Administración de Citas</h1>
            <p class="subtitle">Panel administrativo - Gestión completa del sistema de orientación</p>
        </div>

        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="icon"><i class="fas fa-calendar"></i></div>
                <div class="number" id="stat-total">0</div>
                <div class="label">Total Citas</div>
            </div>
            <div class="stat-card pendientes">
                <div class="icon"><i class="fas fa-clock"></i></div>
                <div class="number" id="stat-pendientes">0</div>
                <div class="label">Pendientes</div>
            </div>
            <div class="stat-card aceptadas">
                <div class="icon"><i class="fas fa-check-circle"></i></div>
                <div class="number" id="stat-aceptadas">0</div>
                <div class="label">Aceptadas</div>
            </div>
            <div class="stat-card completadas">
                <div class="icon"><i class="fas fa-star"></i></div>
                <div class="number" id="stat-completadas">0</div>
                <div class="label">Completadas</div>
            </div>
            <div class="stat-card orientadores">
                <div class="icon"><i class="fas fa-user-tie"></i></div>
                <div class="number" id="stat-orientadores">0</div>
                <div class="label">Orientadores</div>
            </div>
            <div class="stat-card estudiantes">
                <div class="icon"><i class="fas fa-user-graduate"></i></div>
                <div class="number" id="stat-estudiantes">0</div>
                <div class="label">Estudiantes</div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filters-section">
            <h5><i class="fas fa-filter"></i> Filtros de Búsqueda</h5>
            <div class="filter-row">
                <div>
                    <label for="filtro-estado" class="form-label">Estado</label>
                    <select class="form-select" id="filtro-estado">
                        <option value="">Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="aceptada">Aceptada</option>
                        <option value="completada">Completada</option>
                        <option value="rechazada">Rechazada</option>
                        <option value="propuesta_alternativa">Propuesta Alternativa</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-orientador" class="form-label">Orientador</label>
                    <select class="form-select" id="filtro-orientador">
                        <option value="">Todos los orientadores</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-modalidad" class="form-label">Modalidad</label>
                    <select class="form-select" id="filtro-modalidad">
                        <option value="">Todas las modalidades</option>
                        <option value="presencial">Presencial</option>
                        <option value="virtual">Virtual</option>
                        <option value="telefonica">Telefónica</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-fecha-desde" class="form-label">Desde</label>
                    <input type="date" class="form-control" id="filtro-fecha-desde">
                </div>
                <div>
                    <label for="filtro-fecha-hasta" class="form-label">Hasta</label>
                    <input type="date" class="form-control" id="filtro-fecha-hasta">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn-filtrar" onclick="aplicarFiltros()">
                    <i class="fas fa-search"></i> Buscar
                </button>
                <button class="btn-limpiar" onclick="limpiarFiltros()">
                    <i class="fas fa-eraser"></i> Limpiar
                </button>
            </div>
        </div>

        <!-- Tabla de Citas -->
        <div class="table-section">
            <h5><i class="fas fa-list"></i> Listado de Citas</h5>
            <div id="tabla-container">
                <!-- La tabla se llenará dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal Detalle de Cita -->
    <div class="modal fade" id="modalDetalleCita" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-info-circle"></i> Detalle de la Cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detalle-cita-body">
                    <!-- Se llenará dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const AUTH_API = '/api';
        let todasLasCitas = [];
        let citasFiltradas = [];
        let orientadores = [];

        // Cargar datos al inicio
        document.addEventListener('DOMContentLoaded', function() {
            verificarAutenticacion();
            cargarDatos();
        });

        // Verificar autenticación
        async function verificarAutenticacion() {
            try {
                const response = await fetch('/api/check-auth', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!response.ok) {
                    window.location.href = 'login.html';
                    return;
                }

                const data = await response.json();

                // Solo administradores
                if (data.tipo !== 'administrador') {
                    alert('No tienes permisos para acceder a esta página');
                    window.location.href = 'dashboard.html';
                    return;
                }
            } catch (error) {
                console.error('Error verificando autenticación:', error);
                window.location.href = 'login.html';
            }
        }

        // Cargar datos
        async function cargarDatos() {
            await Promise.all([
                cargarOrientadores(),
                cargarTodasCitas()
            ]);
        }

        // Cargar orientadores
        async function cargarOrientadores() {
            try {
                const response = await fetch(`${AUTH_API}/orientadores`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!response.ok) throw new Error('Error al cargar orientadores');

                const data = await response.json();
                orientadores = data.orientadores;

                // Llenar select de filtro
                const select = document.getElementById('filtro-orientador');
                orientadores.forEach(o => {
                    const option = document.createElement('option');
                    option.value = o.id;
                    option.textContent = o.nombre;
                    select.appendChild(option);
                });

            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Cargar todas las citas
        async function cargarTodasCitas() {
            try {
                const response = await fetch(`${AUTH_API}/citas/todas`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!response.ok) throw new Error('Error al cargar citas');

                const data = await response.json();
                todasLasCitas = data.citas;
                citasFiltradas = todasLasCitas;

                actualizarEstadisticas();
                mostrarTabla();
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar las citas');
            }
        }

        // Actualizar estadísticas
        function actualizarEstadisticas() {
            const total = todasLasCitas.length;
            const pendientes = todasLasCitas.filter(c => c.estado === 'pendiente' || c.estado === 'propuesta_alternativa').length;
            const aceptadas = todasLasCitas.filter(c => c.estado === 'aceptada').length;
            const completadas = todasLasCitas.filter(c => c.estado === 'completada').length;

            // Contar usuarios únicos
            const orientadoresUnicos = new Set(todasLasCitas.map(c => c.orientador_id)).size;
            const estudiantesUnicos = new Set(todasLasCitas.map(c => c.estudiante_id)).size;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-pendientes').textContent = pendientes;
            document.getElementById('stat-aceptadas').textContent = aceptadas;
            document.getElementById('stat-completadas').textContent = completadas;
            document.getElementById('stat-orientadores').textContent = orientadoresUnicos;
            document.getElementById('stat-estudiantes').textContent = estudiantesUnicos;
        }

        // Aplicar filtros
        function aplicarFiltros() {
            const estado = document.getElementById('filtro-estado').value;
            const orientadorId = document.getElementById('filtro-orientador').value;
            const modalidad = document.getElementById('filtro-modalidad').value;
            const fechaDesde = document.getElementById('filtro-fecha-desde').value;
            const fechaHasta = document.getElementById('filtro-fecha-hasta').value;

            citasFiltradas = todasLasCitas.filter(cita => {
                if (estado && cita.estado !== estado) return false;
                if (orientadorId && cita.orientador_id !== parseInt(orientadorId)) return false;
                if (modalidad && cita.modalidad !== modalidad) return false;

                if (fechaDesde) {
                    const citaFecha = new Date(cita.fecha_hora).toISOString().split('T')[0];
                    if (citaFecha < fechaDesde) return false;
                }

                if (fechaHasta) {
                    const citaFecha = new Date(cita.fecha_hora).toISOString().split('T')[0];
                    if (citaFecha > fechaHasta) return false;
                }

                return true;
            });

            mostrarTabla();
        }

        // Limpiar filtros
        function limpiarFiltros() {
            document.getElementById('filtro-estado').value = '';
            document.getElementById('filtro-orientador').value = '';
            document.getElementById('filtro-modalidad').value = '';
            document.getElementById('filtro-fecha-desde').value = '';
            document.getElementById('filtro-fecha-hasta').value = '';

            citasFiltradas = todasLasCitas;
            mostrarTabla();
        }

        // Mostrar tabla
        function mostrarTabla() {
            const container = document.getElementById('tabla-container');

            if (citasFiltradas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h4>No hay citas</h4>
                        <p>No se encontraron citas con los filtros seleccionados</p>
                    </div>
                `;
                return;
            }

            const estadosMap = {
                'pendiente': { texto: 'Pendiente', clase: 'badge-pendiente' },
                'aceptada': { texto: 'Aceptada', clase: 'badge-aceptada' },
                'completada': { texto: 'Completada', clase: 'badge-completada' },
                'rechazada': { texto: 'Rechazada', clase: 'badge-rechazada' },
                'propuesta_alternativa': { texto: 'Propuesta', clase: 'badge-propuesta' },
                'cancelada': { texto: 'Cancelada', clase: 'badge-cancelada' }
            };

            let html = `
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Estudiante</th>
                            <th>Orientador</th>
                            <th>Fecha</th>
                            <th>Modalidad</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            citasFiltradas.forEach(cita => {
                const estado = estadosMap[cita.estado] || { texto: cita.estado, clase: '' };
                const fecha = new Date(cita.fecha_hora).toLocaleString('es-MX', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                html += `
                    <tr>
                        <td>#${cita.id}</td>
                        <td>${cita.estudiante_nombre || 'N/A'}</td>
                        <td>${cita.orientador_nombre || 'N/A'}</td>
                        <td>${fecha}</td>
                        <td><i class="fas fa-${cita.modalidad === 'presencial' ? 'building' : cita.modalidad === 'virtual' ? 'video' : 'phone'}"></i> ${cita.modalidad}</td>
                        <td><span class="badge-estado ${estado.clase}">${estado.texto}</span></td>
                        <td>
                            <button class="btn-accion-tabla btn-ver" onclick="verDetalle(${cita.id})">
                                <i class="fas fa-eye"></i> Ver
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Ver detalle
        function verDetalle(citaId) {
            const cita = todasLasCitas.find(c => c.id === citaId);
            if (!cita) return;

            const estadosMap = {
                'pendiente': 'Pendiente',
                'aceptada': 'Aceptada',
                'completada': 'Completada',
                'rechazada': 'Rechazada',
                'propuesta_alternativa': 'Propuesta Alternativa',
                'cancelada': 'Cancelada'
            };

            const fecha = new Date(cita.fecha_hora).toLocaleString('es-MX', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            let html = `
                <div class="detalle-grupo">
                    <h6><i class="fas fa-info-circle"></i> Información General</h6>
                    <div class="detalle-item">
                        <div class="label">ID de Cita:</div>
                        <div class="value">#${cita.id}</div>
                    </div>
                    <div class="detalle-item">
                        <div class="label">Estado:</div>
                        <div class="value">${estadosMap[cita.estado] || cita.estado}</div>
                    </div>
                    <div class="detalle-item">
                        <div class="label">Fecha y Hora:</div>
                        <div class="value">${fecha}</div>
                    </div>
                    <div class="detalle-item">
                        <div class="label">Duración:</div>

                    </div>
                    <div class="detalle-item">
                        <div class="label">Modalidad:</div>
                        <div class="value">${cita.modalidad}</div>

                    ${cita.ubicacion ? `
                    <div class="detalle-item">

                    </div>

                </div>

                <div class="detalle-grupo">

                    <div class="detalle-item">

                    <div class="detalle-item">
                        <div class="label">Email:</div>

                    </div>

                <div class="detalle-grupo">
                    <h6><i class="fas fa-user-tie"></i> Orientador</h6>
                    <div class="detalle-item">
                        <div class="label">Nombre:</div>
                        <div class="value">${cita.orientador_nombre || 'N/A'}</div>
                    </div>
                    <div class="detalle-item">
                        <div class="label">Email:</div>
                        <div class="value">${cita.orientador_email || 'N/A'}</div>
                    </div>
                    ${cita.especialidad ? `
                    <div class="detalle-item">
                        <div class="label">Especialidad:</div>
                        <div class="value">${cita.especialidad}</div>
                    </div>
                    ` : ''}
                </div>

                <div class="detalle-grupo">
                    <h6><i class="fas fa-comment-dots"></i> Motivo y Descripción</h6>
                    <div class="detalle-item">
                        <div class="label">Motivo:</div>
                        <div class="value">${cita.motivo}</div>
                    </div>
                    ${cita.descripcion_estudiante ? `
                    <div class="detalle-item">
                        <div class="label">Descripción:</div>
                        <div class="value">${cita.descripcion_estudiante}</div>
                    </div>
                    ` : ''}
                </div>

                ${cita.notas_orientador ? `
                <div class="detalle-grupo">
                    <h6><i class="fas fa-sticky-note"></i> Notas del Orientador</h6>
                    <div class="detalle-item">
                        <div class="value">${cita.notas_orientador}</div>
                    </div>
                </div>
                ` : ''}

                ${cita.motivo_rechazo ? `
                <div class="detalle-grupo">
                    <h6><i class="fas fa-times-circle"></i> Motivo de Rechazo</h6>
                    <div class="detalle-item">
                        <div class="value">${cita.motivo_rechazo}</div>
                    </div>
                </div>
                ` : ''}

                ${cita.motivo_cancelacion ? `
                <div class="detalle-grupo">
                    <h6><i class="fas fa-ban"></i> Motivo de Cancelación</h6>
                    <div class="detalle-item">
                        <div class="value">${cita.motivo_cancelacion}</div>
                    </div>
                </div>
                ` : ''}
            `;

            document.getElementById('detalle-cita-body').innerHTML = html;
            const modal = new bootstrap.Modal(document.getElementById('modalDetalleCita'));
            modal.show();
        }
    </script>
