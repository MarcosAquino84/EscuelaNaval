<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Biblioteca Digital HENM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #9D2449 0%, #7A1D3A 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #9D2449;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #9D2449;
            box-shadow: 0 0 0 3px rgba(157, 36, 73, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9D2449 0%, #7A1D3A 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 36, 73, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: white;
            color: #9D2449;
            border: 2px solid #9D2449;
        }

        .btn-secondary:hover {
            background: #9D2449;
            color: white;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .link-box {
            background: #f8f9fa;
            border: 2px dashed #9D2449;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            display: none;
        }

        .link-box p {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }

        .link-box input {
            background: white;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .link-box .btn-copy {
            background: #9D2449;
            color: white;
            padding: 10px;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #9D2449;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Recuperar Contraseña</h1>
            <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu.email@henm.edu.mx" required>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                Solicitar Recuperación
            </button>
        </form>

        <div id="linkBox" class="link-box">
            <p><strong>Enlace de recuperación generado:</strong></p>
            <p>Copia este enlace y ábrelo en tu navegador para restablecer tu contraseña:</p>
            <input type="text" id="resetLink" readonly>
            <button class="btn btn-copy" onclick="copyLink()">Copiar Enlace</button>
            <p style="margin-top: 10px; font-size: 12px; color: #999;">
                Este enlace expirará en 1 hora.
            </p>
        </div>

        <div class="back-link">
            <a href="index.html">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageBox = document.getElementById('messageBox');
            const linkBox = document.getElementById('linkBox');

            // Validar email
            if (!email) {
                showMessage('Por favor ingresa un correo electrónico', 'error');
                return;
            }

            // Deshabilitar botón y mostrar spinner
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Procesando...';
            messageBox.style.display = 'none';
            linkBox.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/password-reset/request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success && data.token && data.enlace) {
                    // Token generado exitosamente
                    showMessage(`Enlace de recuperación generado para ${data.usuario.nombre} ${data.usuario.apellido}`, 'success');

                    // Mostrar enlace
                    document.getElementById('resetLink').value = data.enlace;
                    linkBox.style.display = 'block';

                    // Limpiar formulario
                    document.getElementById('email').value = '';

                } else if (data.success) {
                    // Email no existe pero no lo revelamos por seguridad
                    showMessage('Si el email existe en nuestro sistema, se ha generado un enlace de recuperación.', 'info');
                } else {
                    showMessage(data.message || 'Error al procesar la solicitud', 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('Error de conexión. Verifica que el servicio de autenticación esté activo.', 'error');
            } finally {
                // Restaurar botón
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Solicitar Recuperación';
            }
        });

        function showMessage(text, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
            messageBox.style.display = 'block';
        }

        function copyLink() {
            const linkInput = document.getElementById('resetLink');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); // Para móviles

            try {
                document.execCommand('copy');
                showMessage('Enlace copiado al portapapeles', 'success');
            } catch (err) {
                showMessage('Error al copiar enlace. Por favor cópialo manualmente.', 'error');
            }
        }
    </script>
</body>
</html>
