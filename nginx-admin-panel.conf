server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Archivos estáticos del admin panel
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # DSpace Angular (Frontend)
    location /dspace/ {
        proxy_pass http://dspace-angular:4000/dspace/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /dspace;
        proxy_cookie_path / /dspace/;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # DSpace API (Backend REST)
    location /server/ {
        # ngrok termina el TLS y manda X-Forwarded-Proto: https; hay que
        # propagarlo (no $scheme, que aquí siempre es http) para que DSpace
        # genere sus enlaces HAL con el esquema correcto
        set $fwd_proto $scheme;
        if ($http_x_forwarded_proto != '') {
            set $fwd_proto $http_x_forwarded_proto;
        }
        proxy_pass http://dspace:8080/server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Koha OPAC (Catálogo Público)
    location /koha/ {
        proxy_pass http://koha:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /koha/;
        sub_filter_types text/html text/css text/javascript application/javascript;
        sub_filter_once off;
        sub_filter '"/opac-tmpl/' '"/koha/opac-tmpl/';
        sub_filter "'/opac-tmpl/" "'/koha/opac-tmpl/";
        sub_filter '"/cgi-bin/koha/' '"/koha/cgi-bin/koha/';
        sub_filter "'/cgi-bin/koha/" "'/koha/cgi-bin/koha/";
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Koha Staff Interface (Administración)
    location /koha-staff/ {
        proxy_pass http://koha:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /koha-staff/;
        sub_filter_types text/html text/css text/javascript application/javascript;
        sub_filter_once off;
        sub_filter '"/intranet-tmpl/' '"/koha-staff/intranet-tmpl/';
        sub_filter "'/intranet-tmpl/" "'/koha-staff/intranet-tmpl/";
        sub_filter '"/cgi-bin/koha/' '"/koha-staff/cgi-bin/koha/';
        sub_filter "'/cgi-bin/koha/" "'/koha-staff/cgi-bin/koha/";
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Recursos estáticos de Koha
    location /opac-tmpl/ {
        proxy_pass http://koha:8080/opac-tmpl/;
        proxy_set_header Host $host;
    }

    location /intranet-tmpl/ {
        proxy_pass http://koha:8081/intranet-tmpl/;
        proxy_set_header Host $host;
    }

    # Proxy para el servicio de autenticación
    location /api/ {
        proxy_pass http://auth-service:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS headers (si es necesario)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        add_header Access-Control-Allow-Credentials true;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://auth-service:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
