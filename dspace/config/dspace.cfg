# Basic DSpace Configuration

# DSpace installation directory
dspace.dir = /dspace

# DSpace server url
dspace.server.url = http://localhost:8080/server
dspace.ui.url = http://localhost:4000

# Database settings
db.url = jdbc:postgresql://dspacedb:5432/dspace
db.username = dspace
db.password = dspace_password_2024
db.driver = org.postgresql.Driver
db.dialect = org.hibernate.dialect.PostgreSQL94Dialect
db.schema = public

# Email settings (disabled for development)
mail.server.disabled = true

# Solr server
solr.server = http://dspacesolr:8983/solr

# Site name
dspace.name = Biblioteca Digital

# Default language
default.language = es_ES

# Storage
assetstore.dir = ${dspace.dir}/assetstore

# Log directory
log.dir = ${dspace.dir}/log

# Handle settings
handle.prefix = 123456789

# Authentication
plugin.sequence.org.dspace.authenticate.AuthenticationMethod = org.dspace.authenticate.PasswordAuthentication