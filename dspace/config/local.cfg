# Configuración local de DSpace
# Este archivo sobrescribe las configuraciones por defecto

# Nombre del sitio
dspace.name = Biblioteca Digital

# URLs
dspace.server.url = http://localhost:8080/server
dspace.ui.url = http://localhost:4000

# Base de datos ya configurada por variables de entorno
# No necesita configuración adicional aquí

# Desactivar restricciones para desarrollo
rest.cors.allowed-origins = *

# Idioma por defecto
default.locale = es
webui.supported.locales = es, en

# Zona horaria
default.timezone = America/Argentina/Buenos_Aires

# Desactivar email para desarrollo
mail.server.disabled = true

# Configuración de autenticación
plugin.sequence.org.dspace.authenticate.AuthenticationMethod = org.dspace.authenticate.PasswordAuthentication