# Configuración de idioma español para DSpace Angular

# Idioma por defecto: Español
defaultLanguage: es

# Idiomas disponibles
languages:
  - code: es
    label: Español
    active: true
  - code: en
    label: English
    active: true

# URLs del servidor - el público (ssl/host/port) viene por variables de
# entorno del compose; ssrBaseUrl hace que el renderizado en servidor
# consulte el API por la red interna de Docker (universal.replaceRestUrl
# reescribe los enlaces al dominio público al transferir el estado)
rest:
  nameSpace: /server
  ssrBaseUrl: http://dspace:8080/server

ui:
  ssl: false
  host: 0.0.0.0
  port: 4000
  nameSpace: /dspace

# Nombre del sitio
dspaceName: Biblioteca Digital

# Zona horaria
timezone: America/Argentina/Buenos_Aires
